---
# =============================================================
# PLAYBOOK PRINCIPAL - Déploiement complet cluster K3s
# =============================================================
# Usage : ansible-playbook -i inventory/hosts.yml playbooks/site.yml
# Tags disponibles :
#   network   → Configuration réseau LACP + IPs statiques
#   prereq    → Prérequis système + Git
#   lvm       → Configuration stockage LVM
#   k3s       → Installation K3s
#   storage   → Migration data-dir K3s + préparation Longhorn
#   longhorn  → Installation Longhorn
#   metallb   → Installation MetalLB
#   traefik   → Installation Traefik
#   headlamp  → Installation Headlamp Dashboard
#   monitoring→ Prometheus + Grafana + Alertmanager
#   kubevirt  → Installation KubeVirt
#   rancher   → Installation Rancher UI
# =============================================================

# # PHASE 0 : Configuration réseau (LACP + IPs statiques)
# - name: "PHASE 0 - Configuration réseau"
#   import_playbook: network.yml
#   tags: [network]

# # PHASE 1 : Prérequis sur tous les nœuds
# - name: "PHASE 1 - Prérequis système"
#   import_playbook: prerequisites.yml
#   tags: [prereq]

# # PHASE 2 : Configuration LVM (stockage 3 tiers)
# - name: "PHASE 2 - Configuration LVM"
#   import_playbook: lvm.yml
#   tags: [lvm]

# PHASE 3 : Installation K3s HA (3 control planes + embedded etcd)
- name: "PHASE 3 - K3s Cluster"
  import_playbook: k3s.yml
  tags: [k3s]

# PHASE 3b : Migration data-dir K3s → /data_fast + préparation Longhorn
- name: "PHASE 3b - Storage Setup (K3s data-dir + Longhorn dirs)"
  import_playbook: k3s_storage_setup.yml
  tags: [storage]

# PHASE 4 : Longhorn - Stockage distribué 3 tiers (ultra/fast/slow)
- name: "PHASE 4 - Longhorn Storage"
  import_playbook: longhorn.yml
  tags: [longhorn]

# PHASE 5 : MetalLB - Load Balancer Layer 2 (plage 192.168.0.30-60)
- name: "PHASE 5 - MetalLB"
  import_playbook: metallb.yml
  tags: [metallb]

# PHASE 6 : Traefik - Ingress Controller (IP fixe 192.168.0.20 → *.app.corp.lcl)
- name: "PHASE 6 - Traefik Ingress"
  import_playbook: traefik.yml
  tags: [traefik]

# PHASE 7 : Headlamp - Dashboard Kubernetes
- name: "PHASE 7 - Headlamp Dashboard"
  import_playbook: headlamp.yml
  tags: [headlamp]

# PHASE 8 : Monitoring (Prometheus + Grafana + Alertmanager)
- name: "PHASE 8 - Monitoring Stack"
  import_playbook: monitoring.yml
  tags: [monitoring]

# UPGRADE : K3s rolling upgrade via System Upgrade Controller
# Usage standalone : ansible-playbook -i inventory/hosts.yml playbooks/k3s-upgrade.yml
# ⚠ Ne pas inclure dans un run complet site.yml, exécuter séparément
# - name: "UPGRADE - K3s Rolling Upgrade"
#   import_playbook: k3s-upgrade.yml
#   tags: [k3s-upgrade]

# PHASE 9 : KubeVirt (à venir)
# - name: "PHASE 9 - KubeVirt"
#   import_playbook: kubevirt.yml
#   tags: [kubevirt]

# PHASE 10 : Rancher (à venir)
# - name: "PHASE 10 - Rancher UI"
