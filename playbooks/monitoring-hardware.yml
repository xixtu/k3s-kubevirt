---
# =============================================================
# PLAYBOOK : Hardware Monitoring - Dell T5600 Sensors & SMART
# =============================================================
# Usage : ansible-playbook -i inventory/hosts.yml playbooks/monitoring-hardware.yml
# Tags :
#   hw-modules    → Modules kernel hwmon (coretemp, dell-smm-hwmon)
#   hw-smart      → Script SMART + cron textfile collector
#   hw-exporter   → Helm upgrade node-exporter (active textfile collector)
#   hw-rules      → PrometheusRules hardware (temp, SMART, fans)
#   hw-dashboard  → Dashboards Grafana (Node Exporter Full + SMART disk)
#   hw-verify     → Vérification finale
#
# Architecture :
#   [host cron] → smart-metrics.sh → /var/lib/node_exporter/textfile_collector/smart.prom
#   [node-exporter DaemonSet] → mount hostPath → expose via /metrics
#   [Prometheus] → scrape → stocke séries node_smart_* et node_hwmon_*
#   [Grafana] → dashboard hardware / SMART
#
# Prérequis :
#   - monitoring.yml exécuté (kube-prometheus-stack déployé)
#   - smartmontools déjà installé (common_packages)
#   - Machines : Dell Precision T5600 (x86, kernel ≥ 5.4)
#
# Note SSH :
#   Ce playbook ne nécessite PAS de SSH vers les nœuds.
#   La Partie 1 utilise kubectl exec sur des pods privilégiés (hostPID + host root monté).
#   La Partie 2 s'exécute en connection locale sur k3s-node-1.
# =============================================================

# =============================================================
# PARTIE 1 : Setup sur chaque nœud K3s via kubectl
# Pas de SSH — pods privilégiés avec host root monté sous /host
# =============================================================
- name: "Hardware Monitoring - Setup nœuds via kubectl"
  hosts: k3s-node-1
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - "../group_vars/k3s_cluster.yml"

  tasks:

    # ----------------------------------------------------------
    # POD PRIVILÉGIÉ : un pod par nœud avec accès au host
    # Utilisé par hw-modules ET hw-smart
    # ----------------------------------------------------------

    - name: "Créer le pod de setup sur {{ node }}"
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: "hw-setup-{{ node | replace('k3s-', '') }}"
            namespace: kube-system
            labels:
              app: hw-setup
          spec:
            nodeName: "{{ node }}"
            restartPolicy: Never
            tolerations:
              - operator: Exists
            hostPID: true
            containers:
              - name: setup
                image: alpine:3.19
                command: ["sleep", "300"]
                securityContext:
                  privileged: true
                volumeMounts:
                  - name: host-root
                    mountPath: /host
            volumes:
              - name: host-root
                hostPath:
                  path: /
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-modules, hw-smart]

    - name: "Attendre que le pod hw-setup-{{ node | replace('k3s-', '') }} soit Ready"
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: v1
        kind: Pod
        name: "hw-setup-{{ node | replace('k3s-', '') }}"
        namespace: kube-system
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 90
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-modules, hw-smart]

    # ----------------------------------------------------------
    # MODULES KERNEL (tag: hw-modules)
    # ----------------------------------------------------------

    - name: "Installer lm-sensors sur {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- chroot /host apt-get install -y --no-install-recommends lm-sensors
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      failed_when: false
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-modules]

    - name: "Charger le module coretemp sur {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- chroot /host modprobe coretemp
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-modules]

    - name: "Charger le module dell-smm-hwmon sur {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- chroot /host sh -c "modprobe dell-smm-hwmon restricted=0 ignore_dmi=1"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: dell_smm_result
      failed_when: false
      changed_when: false
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-modules]

    - name: "Avertir si dell-smm-hwmon non disponible sur {{ item.node }}"
      ansible.builtin.debug:
        msg: "ATTENTION : module dell-smm-hwmon non chargé sur {{ item.node }} — vérifier le kernel"
      when: item.rc is defined and item.rc != 0
      loop: "{{ dell_smm_result.results }}"
      loop_control:
        label: "{{ item.node }}"
      tags: [hw-modules]

    - name: "Persister les modules au démarrage sur {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- sh -c "printf 'coretemp\ndell-smm-hwmon\n'
          > /host/etc/modules-load.d/hwmon-dell.conf"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-modules]

    - name: "Configurer les options du module dell-smm-hwmon sur {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- sh -c "printf 'options dell-smm-hwmon restricted=0 ignore_dmi=1\n'
          > /host/etc/modprobe.d/dell-smm-hwmon.conf"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-modules]

    # ----------------------------------------------------------
    # RÉPERTOIRE TEXTFILE COLLECTOR (tag: hw-smart)
    # ----------------------------------------------------------

    - name: "Créer le répertoire textfile_collector sur {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- sh -c "mkdir -p /host/var/lib/node_exporter/textfile_collector
          && chmod 755 /host/var/lib/node_exporter/textfile_collector"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-smart]

    # ----------------------------------------------------------
    # SCRIPT SMART METRICS (tag: hw-smart)
    # Source de vérité : scripts/smart-metrics.sh
    # ----------------------------------------------------------

    - name: "Copier smart-metrics.sh vers le pod sur {{ node }}"
      ansible.builtin.command: >
        kubectl cp {{ playbook_dir }}/../scripts/smart-metrics.sh
        kube-system/hw-setup-{{ node | replace('k3s-', '') }}:/tmp/smart-metrics.sh
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-smart]

    - name: "Installer smart-metrics.sh sur le host {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- sh -c "cp /tmp/smart-metrics.sh /host/usr/local/bin/smart-metrics.sh
          && chmod 755 /host/usr/local/bin/smart-metrics.sh"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-smart]

    - name: "Créer le cron job SMART sur {{ node }} (toutes les 5 minutes)"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- sh -c "printf '*/5 * * * * root /usr/local/bin/smart-metrics.sh 2>/dev/null\n'
          > /host/etc/cron.d/smart-metrics-prom
          && chmod 644 /host/etc/cron.d/smart-metrics-prom"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-smart]

    - name: "Exécuter smart-metrics.sh une première fois sur {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- chroot /host /usr/local/bin/smart-metrics.sh
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      failed_when: false
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-smart]

    - name: "Vérifier le fichier smart.prom généré sur {{ node }}"
      ansible.builtin.command: >
        kubectl exec hw-setup-{{ node | replace('k3s-', '') }}
        -n kube-system
        -- cat /host/var/lib/node_exporter/textfile_collector/smart.prom
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: smart_prom_check
      changed_when: false
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-smart]

    - name: Afficher les métriques SMART générées
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ smart_prom_check.results }}"
      loop_control:
        label: "{{ item.node }}"
      tags: [hw-smart]

    # ----------------------------------------------------------
    # NETTOYAGE : supprimer les pods de setup
    # ----------------------------------------------------------

    - name: "Supprimer le pod de setup sur {{ node }}"
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: absent
        api_version: v1
        kind: Pod
        name: "hw-setup-{{ node | replace('k3s-', '') }}"
        namespace: kube-system
      loop: "{{ groups['k3s_cluster'] }}"
      loop_control:
        loop_var: node
        label: "{{ node }}"
      tags: [hw-modules, hw-smart]


# =============================================================
# PARTIE 2 : Ressources Kubernetes (node-exporter + rules + dashboards)
# =============================================================
- name: "Hardware Monitoring - Ressources Kubernetes"
  hosts: k3s-node-1
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - "../group_vars/k3s_cluster.yml"

  tasks:

    # ----------------------------------------------------------
    # HELM UPGRADE : activer textfile collector dans node-exporter
    # ----------------------------------------------------------

    - name: Écrire les valeurs node-exporter (textfile collector)
      ansible.builtin.copy:
        dest: /tmp/node-exporter-hw-values.yml
        mode: '0644'
        content: |
          prometheus-node-exporter:
            extraArgs:
              - --collector.textfile.directory=/host/textfile_collector
            extraVolumes:
              - name: textfile-collector
                hostPath:
                  path: /var/lib/node_exporter/textfile_collector
                  type: DirectoryOrCreate
            extraVolumeMounts:
              - name: textfile-collector
                mountPath: /host/textfile_collector
      tags: [hw-exporter]

    - name: Helm upgrade node-exporter (textfile collector)
      ansible.builtin.command: >
        helm upgrade kube-prometheus-stack
        prometheus-community/kube-prometheus-stack
        --namespace monitoring
        --reuse-values
        --version {{ prometheus_stack_version }}
        --values /tmp/node-exporter-hw-values.yml
        --wait
        --timeout 5m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      tags: [hw-exporter]

    - name: Supprimer le fichier de valeurs temporaire
      ansible.builtin.file:
        path: /tmp/node-exporter-hw-values.yml
        state: absent
      tags: [hw-exporter]

    - name: Attendre que les pods node-exporter soient Ready
      ansible.builtin.command: >
        k3s kubectl rollout status daemonset
        kube-prometheus-stack-prometheus-node-exporter
        -n monitoring
        --timeout=120s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [hw-exporter]

    # ----------------------------------------------------------
    # PROMETHEUSRULES : alertes hardware
    # ----------------------------------------------------------

    - name: Écrire les PrometheusRules hardware
      ansible.builtin.copy:
        dest: /tmp/hardware-prometheusrules.yml
        mode: '0644'
        # !unsafe : empêche Jinja2 de parser {{ $labels.xxx }} et {{ $value }}
        # qui sont des annotations PromQL, pas des variables Ansible
        content: !unsafe |
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: hardware-rules
            namespace: monitoring
            labels:
              app: kube-prometheus-stack
              release: kube-prometheus-stack
          spec:
            groups:

              # ------------------------------------------------
              # Températures CPU (Intel coretemp)
              # node_hwmon_temp_celsius{chip=~"coretemp.*", sensor="temp1"} = Package temp
              # ------------------------------------------------
              - name: hardware.cpu.temperature
                rules:
                  - alert: NodeCPUTempWarning
                    expr: >
                      node_hwmon_temp_celsius{chip=~"coretemp.*", sensor=~"temp[0-9]+"}
                      > 75
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Température CPU élevée sur {{ $labels.instance }}"
                      description: >
                        CPU {{ $labels.sensor }} sur {{ $labels.instance }} :
                        {{ $value | printf "%.1f" }}°C (seuil warning 75°C)

                  - alert: NodeCPUTempCritical
                    expr: >
                      node_hwmon_temp_celsius{chip=~"coretemp.*", sensor=~"temp[0-9]+"}
                      > 85
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "CRITIQUE : température CPU sur {{ $labels.instance }}"
                      description: >
                        CPU {{ $labels.sensor }} sur {{ $labels.instance }} :
                        {{ $value | printf "%.1f" }}°C (seuil critique 85°C) —
                        risque throttling / dommage matériel

              # ------------------------------------------------
              # Températures Dell SMM (SODIMM, Ambient, CPU dell)
              # node_hwmon_temp_celsius{chip=~"dell_smm.*"}
              # ------------------------------------------------
              - name: hardware.dell.temperature
                rules:
                  - alert: NodeDellAmbientTempWarning
                    expr: >
                      node_hwmon_temp_celsius{chip=~"dell_smm.*"}
                      > 45
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Température interne Dell élevée sur {{ $labels.instance }}"
                      description: >
                        Capteur Dell {{ $labels.sensor }} sur {{ $labels.instance }} :
                        {{ $value | printf "%.1f" }}°C (seuil 45°C)

                  - alert: NodeDellAmbientTempCritical
                    expr: >
                      node_hwmon_temp_celsius{chip=~"dell_smm.*"}
                      > 55
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "CRITIQUE : température interne Dell sur {{ $labels.instance }}"
                      description: >
                        Capteur Dell {{ $labels.sensor }} sur {{ $labels.instance }} :
                        {{ $value | printf "%.1f" }}°C (seuil critique 55°C)

              # ------------------------------------------------
              # Ventilateurs (node_hwmon_fan_rpm)
              # ------------------------------------------------
              - name: hardware.fans
                rules:
                  - alert: NodeFanStopped
                    # min_over_time + max_over_time sur la MÊME métrique courante
                    # → pas de problème de label-mismatch avec offset/unless
                    # quand un chip hwmon est rechargé ou réénuméré (GPU PCI addr)
                    expr: >
                      min_over_time(node_hwmon_fan_rpm[5m]) == 0
                      and max_over_time(node_hwmon_fan_rpm[15m]) > 100
                    for: 3m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Ventilateur arrêté sur {{ $labels.instance }}"
                      description: >
                        Ventilateur {{ $labels.sensor }} ({{ $labels.chip }}) sur
                        {{ $labels.instance }} était actif (>100 RPM dans les 15 min)
                        et est à 0 RPM depuis plus de 5 min

                  - alert: NodeFanSpeedLow
                    expr: >
                      node_hwmon_fan_rpm{sensor=~"fan[0-9]+"}
                      > 0 and node_hwmon_fan_rpm{sensor=~"fan[0-9]+"} < 400
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Ventilateur lent sur {{ $labels.instance }}"
                      description: >
                        Ventilateur {{ $labels.sensor }} sur {{ $labels.instance }} :
                        {{ $value | printf "%.0f" }} RPM (seuil minimum 400 RPM)

              # ------------------------------------------------
              # GPU (nouveau driver)
              # node_hwmon_temp_celsius{chip=~"nouveau.*"}
              # ------------------------------------------------
              - name: hardware.gpu
                rules:
                  - alert: NodeGPUTempWarning
                    expr: >
                      node_hwmon_temp_celsius{chip=~"nouveau.*"}
                      > 75
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Température GPU élevée sur {{ $labels.instance }}"
                      description: >
                        GPU sur {{ $labels.instance }} :
                        {{ $value | printf "%.1f" }}°C (seuil 75°C)

              # ------------------------------------------------
              # SMART - Santé disques (métriques textfile collector)
              # ------------------------------------------------
              - name: hardware.smart.health
                rules:
                  - alert: DiskSMARTFailed
                    expr: node_smart_device_health == 0
                    for: 0m
                    labels:
                      severity: critical
                    annotations:
                      summary: "SMART FAILED sur {{ $labels.instance }}"
                      description: >
                        Disque {{ $labels.device }} ({{ $labels.model }})
                        sur {{ $labels.instance }} a échoué le self-test SMART.
                        Remplacement urgent requis.

                  - alert: DiskSMARTReallocatedSectors
                    expr: node_smart_reallocated_sectors_total > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Secteurs réalloués sur {{ $labels.instance }}"
                      description: >
                        Disque {{ $labels.device }} ({{ $labels.model }})
                        sur {{ $labels.instance }} :
                        {{ $value | printf "%.0f" }} secteur(s) réalloué(s).
                        Signe de défaillance imminente.

                  - alert: DiskSMARTPendingSectors
                    expr: node_smart_pending_sectors_total > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Secteurs en attente sur {{ $labels.instance }}"
                      description: >
                        Disque {{ $labels.device }} ({{ $labels.model }})
                        sur {{ $labels.instance }} :
                        {{ $value | printf "%.0f" }} secteur(s) en attente de réallocation.

              # ------------------------------------------------
              # SMART - Températures disques
              # ------------------------------------------------
              - name: hardware.smart.temperature
                rules:
                  - alert: DiskTempWarning
                    expr: node_smart_temperature_celsius > 50
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Température disque élevée sur {{ $labels.instance }}"
                      description: >
                        Disque {{ $labels.device }} ({{ $labels.model }})
                        sur {{ $labels.instance }} :
                        {{ $value | printf "%.0f" }}°C (seuil warning 50°C)

                  - alert: DiskTempCritical
                    expr: node_smart_temperature_celsius > 60
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "CRITIQUE : température disque sur {{ $labels.instance }}"
                      description: >
                        Disque {{ $labels.device }} ({{ $labels.model }})
                        sur {{ $labels.instance }} :
                        {{ $value | printf "%.0f" }}°C (seuil critique 60°C) —
                        risque de perte de données

              # ------------------------------------------------
              # SMART - Collecte (freshness check)
              # ------------------------------------------------
              - name: hardware.smart.freshness
                rules:
                  - alert: SMARTCollectionStale
                    expr: >
                      (time() - node_smart_collection_timestamp_seconds) > 600
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Collecte SMART bloquée sur {{ $labels.instance }}"
                      description: >
                        Le script smart-metrics.sh sur {{ $labels.instance }}
                        n'a pas mis à jour les métriques depuis
                        {{ $value | printf "%.0f" }} secondes (seuil 600s = 10 min).
                        Vérifier le cron job.
      tags: [hw-rules]

    - name: Appliquer les PrometheusRules hardware
      ansible.builtin.command: k3s kubectl apply -f /tmp/hardware-prometheusrules.yml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [hw-rules]

    - name: Supprimer le fichier PrometheusRules temporaire
      ansible.builtin.file:
        path: /tmp/hardware-prometheusrules.yml
        state: absent
      tags: [hw-rules]

    # ----------------------------------------------------------
    # GRAFANA DASHBOARDS
    # ----------------------------------------------------------

    - name: Télécharger le dashboard Node Exporter Full (ID 1860)
      ansible.builtin.command: >
        curl -sL https://grafana.com/api/dashboards/1860/revisions/latest/download
        -o /tmp/node-exporter-full-dashboard.json
      changed_when: false
      tags: [hw-dashboard]

    - name: Lire le dashboard Node Exporter Full
      ansible.builtin.slurp:
        src: /tmp/node-exporter-full-dashboard.json
      register: node_exporter_dashboard_json
      tags: [hw-dashboard]

    - name: Créer le ConfigMap dashboard Node Exporter Full
      ansible.builtin.copy:
        dest: /tmp/node-exporter-full-cm.yml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: node-exporter-full-dashboard
            namespace: monitoring
            labels:
              grafana_dashboard: "1"
          data:
            node-exporter-full-dashboard.json: |
              {{ node_exporter_dashboard_json.content | b64decode | indent(6) }}
      tags: [hw-dashboard]

    - name: Appliquer le ConfigMap dashboard Node Exporter Full
      # --server-side : évite l'annotation last-applied-configuration (limite 256KB)
      # le dashboard Node Exporter Full (ID 1860) dépasse cette limite
      ansible.builtin.command: k3s kubectl apply --server-side -f /tmp/node-exporter-full-cm.yml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [hw-dashboard]

    - name: Télécharger le dashboard SMART disk data (ID 10530)
      ansible.builtin.command: >
        curl -sL https://grafana.com/api/dashboards/10530/revisions/latest/download
        -o /tmp/smart-dashboard.json
      changed_when: false
      tags: [hw-dashboard]

    - name: Lire le dashboard SMART
      ansible.builtin.slurp:
        src: /tmp/smart-dashboard.json
      register: smart_dashboard_json
      tags: [hw-dashboard]

    - name: Créer le ConfigMap dashboard SMART
      ansible.builtin.copy:
        dest: /tmp/smart-dashboard-cm.yml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: smart-disk-dashboard
            namespace: monitoring
            labels:
              grafana_dashboard: "1"
          data:
            smart-disk-dashboard.json: |
              {{ smart_dashboard_json.content | b64decode | indent(6) }}
      tags: [hw-dashboard]

    - name: Appliquer le ConfigMap dashboard SMART
      ansible.builtin.command: k3s kubectl apply --server-side -f /tmp/smart-dashboard-cm.yml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [hw-dashboard]

    - name: Supprimer les fichiers dashboard temporaires
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/node-exporter-full-dashboard.json
        - /tmp/node-exporter-full-cm.yml
        - /tmp/smart-dashboard.json
        - /tmp/smart-dashboard-cm.yml
      tags: [hw-dashboard]

    # ----------------------------------------------------------
    # VÉRIFICATION
    # ----------------------------------------------------------

    - name: Vérifier les PrometheusRules hardware
      ansible.builtin.command: k3s kubectl get prometheusrule hardware-rules -n monitoring
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: hw_rules_check
      changed_when: false
      tags: [hw-verify]

    - name: Vérifier les ConfigMaps dashboard
      ansible.builtin.command: >
        k3s kubectl get configmap -n monitoring
        -l grafana_dashboard=1
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: grafana_cm_check
      changed_when: false
      tags: [hw-verify]

    - name: Vérifier les args du DaemonSet node-exporter
      ansible.builtin.command: >
        k3s kubectl get daemonset
        kube-prometheus-stack-prometheus-node-exporter
        -n monitoring
        -o jsonpath='{.spec.template.spec.containers[0].args}'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: node_exporter_args
      changed_when: false
      tags: [hw-verify]

    - name: Résumé Hardware Monitoring
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "  Hardware Monitoring installé"
          - "================================================"
          - "PrometheusRules  : {{ hw_rules_check.stdout }}"
          - "Grafana dashboards :"
          - "{{ grafana_cm_check.stdout_lines }}"
          - "node-exporter args :"
          - "  {{ node_exporter_args.stdout }}"
          - "================================================"
          - "  Métriques disponibles dans Prometheus"
          - "================================================"
          - "  node_hwmon_temp_celsius    → CPU / SODIMM / GPU / Ambient"
          - "  node_hwmon_fan_rpm         → Ventilateurs"
          - "  node_smart_device_health   → PASSED(1) / FAILED(0)"
          - "  node_smart_temperature_celsius → Température disques"
          - "  node_smart_reallocated_sectors_total → Secteurs défaillants"
          - "  node_smart_pending_sectors_total     → Secteurs en attente"
          - "  node_smart_power_on_hours_total      → Heures de fonctionnement"
          - "================================================"
          - "  Alertes configurées"
          - "================================================"
          - "  NodeCPUTempWarning / NodeCPUTempCritical     (75°C / 85°C)"
          - "  NodeDellAmbientTempWarning / Critical        (45°C / 55°C)"
          - "  NodeFanStopped / NodeFanSpeedLow             (arrêt / < 400 RPM)"
          - "  NodeGPUTempWarning                           (75°C)"
          - "  DiskSMARTFailed                              (santé FAILED)"
          - "  DiskSMARTReallocatedSectors                  (> 0)"
          - "  DiskSMARTPendingSectors                      (> 0)"
          - "  DiskTempWarning / DiskTempCritical           (50°C / 60°C)"
          - "  SMARTCollectionStale                         (> 10 min sans update)"
          - "================================================"
      tags: [hw-verify]
