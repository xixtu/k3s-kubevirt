---
# =============================================================
# PLAYBOOK : Déploiement Nextcloud - Cloud personnel
# =============================================================
# Usage : ansible-playbook -i inventory/hosts.yml playbooks/nextcloud.yml
# Tags :
#   nextcloud-install → Namespace, Secrets, PVC, PostgreSQL, Nextcloud, Service
#   nextcloud-ingress → Ingress TLS + IngressRoute HTTPS
#   letsencrypt-tls   → Ingress TLS + migration ECDSA + IngressRoute HTTPS
#   nextcloud-ldap    → Compte AD s_next_ad + configuration LDAP backend
#   nextcloud-verify  → Vérification pods, service, ingress, cert
# Prérequis :
#   - K3s + MetalLB + Traefik installés
#   - Longhorn StorageClasses (longhorn-fast)
#   - cert-manager + ClusterIssuer letsencrypt-production
#   - NAS déployé (playbooks/nas.yml) pour le plugin External Storage SMB
#   - DNS : nextcloud.app.xixtu.eu → A → <IP publique>
# URL publique : https://nextcloud.app.xixtu.eu
# =============================================================
# Connexion au NAS (post-déploiement, via interface admin Nextcloud) :
#   1. Activer l'app "External storage support" dans Nextcloud
#   2. Administration > Stockages externes > Ajouter :
#      - Type : SMB/CIFS
#      - Host : samba-service.nas.svc.cluster.local
#      - Share : media / documents / shared
#      - Auth  : "User entered, stored in database"
#      - Les utilisateurs saisissent leurs identifiants AD (user@corp.lcl)
#   L'indexation est automatique via le plugin (pas de occ files:scan)
# =============================================================

- name: "Nextcloud - Cloud personnel avec External Storage SMB"
  hosts: k3s-node-1
  become: true
  gather_facts: false
  vars_files:
    - "../group_vars/k3s_cluster.yml"
  vars:
    target_namespace: "nextcloud"
    app_name: "nextcloud"
    storage_class: "{{ nextcloud_config.storage_class }}"
    db_storage_size: "{{ nextcloud_config.db_storage_size }}"
    data_storage_size: "{{ nextcloud_config.data_storage_size }}"
    # PostgreSQL
    db_name: "{{ nextcloud_config.db_name }}"
    db_user: "{{ nextcloud_config.db_user }}"
    db_password: "{{ nextcloud_config.db_password }}"
    # Nextcloud
    nextcloud_image: "nextcloud:29-apache"
    # LDAP / Active Directory
    ldap_bind_dn: "CN={{ nextcloud_config.ldap_bind_user }},CN=Users,DC=corp,DC=lcl"
    ldap_base_dn: "DC=corp,DC=lcl"
    ldap_users_dn: "CN=Users,DC=corp,DC=lcl"

  tasks:

    # ==========================================================
    # NAMESPACE
    # ==========================================================

    - name: Créer le namespace nextcloud
      ansible.builtin.command: k3s kubectl create namespace {{ target_namespace }}
      register: ns_create
      failed_when: ns_create.rc != 0 and 'already exists' not in ns_create.stderr
      changed_when: ns_create.rc == 0
      tags: [nextcloud, nextcloud-install]

    # ==========================================================
    # SECRETS (PostgreSQL + Nextcloud admin)
    # ==========================================================

    - name: Créer le Secret PostgreSQL
      ansible.builtin.shell: |
        k3s kubectl create secret generic {{ app_name }}-db-secret \
          --namespace {{ target_namespace }} \
          --from-literal=POSTGRES_PASSWORD={{ db_password }} \
          --from-literal=POSTGRES_USER={{ db_user }} \
          --from-literal=POSTGRES_DB={{ db_name }} \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: true
      tags: [nextcloud, nextcloud-install]

    - name: Créer le Secret Nextcloud admin
      ansible.builtin.shell: |
        k3s kubectl create secret generic {{ app_name }}-admin-secret \
          --namespace {{ target_namespace }} \
          --from-literal=NEXTCLOUD_ADMIN_USER={{ nextcloud_config.admin_user }} \
          --from-literal=NEXTCLOUD_ADMIN_PASSWORD={{ nextcloud_config.admin_password }} \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: true
      tags: [nextcloud, nextcloud-install]

    # ==========================================================
    # PVC (PostgreSQL + Nextcloud data)
    # ==========================================================

    - name: Écrire les PVC Nextcloud
      ansible.builtin.copy:
        dest: /tmp/nextcloud-pvc.yml
        mode: '0644'
        content: |
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: {{ app_name }}-db-data
            namespace: {{ target_namespace }}
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: {{ storage_class }}
            resources:
              requests:
                storage: {{ db_storage_size }}
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: {{ app_name }}-data
            namespace: {{ target_namespace }}
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: {{ storage_class }}
            resources:
              requests:
                storage: {{ data_storage_size }}
      tags: [nextcloud, nextcloud-install]

    - name: Appliquer les PVC Nextcloud
      ansible.builtin.command: k3s kubectl apply -f /tmp/nextcloud-pvc.yml
      register: pvc_apply
      changed_when: "'configured' in pvc_apply.stdout or 'created' in pvc_apply.stdout"
      tags: [nextcloud, nextcloud-install]

    - name: Supprimer le fichier PVC temporaire
      ansible.builtin.file:
        path: /tmp/nextcloud-pvc.yml
        state: absent
      tags: [nextcloud, nextcloud-install]

    # ==========================================================
    # POSTGRESQL 16
    # ==========================================================

    - name: Écrire le Deployment PostgreSQL
      ansible.builtin.copy:
        dest: /tmp/nextcloud-postgres.yml
        mode: '0644'
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ app_name }}-postgres
            namespace: {{ target_namespace }}
            labels:
              app: {{ app_name }}-postgres
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: {{ app_name }}-postgres
            template:
              metadata:
                labels:
                  app: {{ app_name }}-postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-bookworm
                    ports:
                      - containerPort: 5432
                    envFrom:
                      - secretRef:
                          name: {{ app_name }}-db-secret
                    volumeMounts:
                      - name: db-data
                        mountPath: /var/lib/postgresql/data
                        subPath: pgdata
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        memory: 512Mi
                volumes:
                  - name: db-data
                    persistentVolumeClaim:
                      claimName: {{ app_name }}-db-data
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: {{ app_name }}-postgres
            namespace: {{ target_namespace }}
          spec:
            selector:
              app: {{ app_name }}-postgres
            ports:
              - protocol: TCP
                port: 5432
                targetPort: 5432
            type: ClusterIP
      tags: [nextcloud, nextcloud-install]

    - name: Appliquer le Deployment PostgreSQL
      ansible.builtin.command: k3s kubectl apply -f /tmp/nextcloud-postgres.yml
      register: pg_apply
      changed_when: "'configured' in pg_apply.stdout or 'created' in pg_apply.stdout"
      tags: [nextcloud, nextcloud-install]

    - name: Supprimer le fichier PostgreSQL temporaire
      ansible.builtin.file:
        path: /tmp/nextcloud-postgres.yml
        state: absent
      tags: [nextcloud, nextcloud-install]

    - name: Attendre que PostgreSQL soit Ready
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Ready pods
        -l app={{ app_name }}-postgres
        -n {{ target_namespace }}
        --timeout=120s
      changed_when: false
      tags: [nextcloud, nextcloud-install]

    # ==========================================================
    # NEXTCLOUD (Application)
    # ==========================================================
    # Image : nextcloud:29-apache
    # - smbclient installé via command override (root) avant entrypoint
    # - Derrière Traefik reverse proxy (OVERWRITEPROTOCOL=https)
    # - Trusted proxies = pod CIDR (Flannel)
    # ==========================================================

    - name: Écrire le Deployment Nextcloud
      ansible.builtin.copy:
        dest: /tmp/nextcloud-app.yml
        mode: '0644'
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ app_name }}
            namespace: {{ target_namespace }}
            labels:
              app: {{ app_name }}
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: {{ app_name }}
            template:
              metadata:
                labels:
                  app: {{ app_name }}
              spec:
                containers:
                  - name: nextcloud
                    image: {{ nextcloud_image }}
                    # Override : installe smbclient en root puis lance l'entrypoint
                    # Le hook before-starting échoue (Permission denied) car Nextcloud 29
                    # exécute les hooks avec des privileges réduits.
                    command: ["/bin/bash", "-c"]
                    args:
                      - |
                        echo "[init] Installation de smbclient..."
                        apt-get update -qq && \
                        apt-get install -y -qq --no-install-recommends smbclient && \
                        rm -rf /var/lib/apt/lists/*
                        echo "[init] smbclient OK - lancement Nextcloud"
                        exec /entrypoint.sh apache2-foreground
                    ports:
                      - containerPort: 80
                    envFrom:
                      - secretRef:
                          name: {{ app_name }}-admin-secret
                    env:
                      # --- PostgreSQL ---
                      - name: POSTGRES_HOST
                        value: "{{ app_name }}-postgres"
                      - name: POSTGRES_DB
                        value: "{{ db_name }}"
                      - name: POSTGRES_USER
                        value: "{{ db_user }}"
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: {{ app_name }}-db-secret
                            key: POSTGRES_PASSWORD
                      # --- Reverse proxy (Traefik) ---
                      - name: OVERWRITEPROTOCOL
                        value: "https"
                      - name: OVERWRITEHOST
                        value: "{{ external_domains.nextcloud }}"
                      - name: TRUSTED_PROXIES
                        value: "{{ cluster_network.pod_cidr }}"
                      - name: NEXTCLOUD_TRUSTED_DOMAINS
                        value: "{{ external_domains.nextcloud }}"
                      # --- PHP tuning ---
                      - name: PHP_MEMORY_LIMIT
                        value: "512M"
                      - name: PHP_UPLOAD_LIMIT
                        value: "10G"
                    volumeMounts:
                      - name: nextcloud-data
                        mountPath: /var/www/html
                    resources:
                      requests:
                        cpu: 200m
                        memory: 256Mi
                      limits:
                        memory: 2Gi
                    livenessProbe:
                      httpGet:
                        path: /status.php
                        port: 80
                        httpHeaders:
                          - name: Host
                            value: "{{ external_domains.nextcloud }}"
                      initialDelaySeconds: 120
                      periodSeconds: 30
                      timeoutSeconds: 10
                    readinessProbe:
                      httpGet:
                        path: /status.php
                        port: 80
                        httpHeaders:
                          - name: Host
                            value: "{{ external_domains.nextcloud }}"
                      initialDelaySeconds: 60
                      periodSeconds: 10
                      timeoutSeconds: 5
                volumes:
                  - name: nextcloud-data
                    persistentVolumeClaim:
                      claimName: {{ app_name }}-data
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: {{ app_name }}-service
            namespace: {{ target_namespace }}
          spec:
            selector:
              app: {{ app_name }}
            ports:
              - protocol: TCP
                port: 80
                targetPort: 80
            type: ClusterIP
      tags: [nextcloud, nextcloud-install]

    - name: Appliquer le Deployment Nextcloud
      ansible.builtin.command: k3s kubectl apply -f /tmp/nextcloud-app.yml
      register: app_apply
      changed_when: "'configured' in app_apply.stdout or 'created' in app_apply.stdout"
      tags: [nextcloud, nextcloud-install]

    - name: Supprimer le fichier Nextcloud temporaire
      ansible.builtin.file:
        path: /tmp/nextcloud-app.yml
        state: absent
      tags: [nextcloud, nextcloud-install]

    # ==========================================================
    # TLS - CERTIFICAT LET'S ENCRYPT (nextcloud.app.xixtu.eu)
    # ==========================================================
    # Pattern : Ingress K8s (déclenche cert-manager) + IngressRoute HTTPS
    # ==========================================================

    - name: Écrire l'Ingress TLS Nextcloud
      ansible.builtin.copy:
        dest: /tmp/nextcloud-ingress.yml
        mode: '0644'
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: {{ app_name }}-ingress
            namespace: {{ target_namespace }}
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-production"
              cert-manager.io/private-key-algorithm: "ECDSA"
              cert-manager.io/private-key-size: "256"
              traefik.ingress.kubernetes.io/router.entrypoints: "web"
              traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-to-https@kubernetescrd"
          spec:
            ingressClassName: traefik
            tls:
              - hosts:
                  - "{{ external_domains.nextcloud }}"
                secretName: {{ app_name }}-tls
            rules:
              - host: "{{ external_domains.nextcloud }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: {{ app_name }}-service
                          port:
                            number: 80
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    - name: Appliquer l'Ingress TLS Nextcloud
      ansible.builtin.command: k3s kubectl apply -f /tmp/nextcloud-ingress.yml
      register: ingress_apply
      changed_when: "'configured' in ingress_apply.stdout or 'created' in ingress_apply.stdout"
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    - name: Supprimer le fichier Ingress temporaire
      ansible.builtin.file:
        path: /tmp/nextcloud-ingress.yml
        state: absent
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    # ==========================================================
    # MIGRATION ECDSA (si ancien certificat RSA)
    # ==========================================================

    - name: Vérifier le type de clé du certificat actuel
      ansible.builtin.shell: >
        k3s kubectl get secret {{ app_name }}-tls -n {{ target_namespace }}
        -o jsonpath='{.data.tls\.key}' | base64 -d
        | openssl ec -noout 2>/dev/null && echo "ECDSA" || echo "RSA"
      register: nextcloud_cert_key_type
      changed_when: false
      failed_when: false
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    - name: Supprimer l'ancien certificat RSA pour renouvellement ECDSA
      ansible.builtin.command: >
        k3s kubectl delete certificate {{ app_name }}-tls
        -n {{ target_namespace }} --ignore-not-found
      when: nextcloud_cert_key_type.stdout is defined and 'ECDSA' not in nextcloud_cert_key_type.stdout
      changed_when: true
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    - name: Supprimer l'ancien secret TLS RSA
      ansible.builtin.command: >
        k3s kubectl delete secret {{ app_name }}-tls
        -n {{ target_namespace }} --ignore-not-found
      when: nextcloud_cert_key_type.stdout is defined and 'ECDSA' not in nextcloud_cert_key_type.stdout
      changed_when: true
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    # ==========================================================
    # INGRESSROUTE HTTPS (Traefik CRD - router websecure)
    # ==========================================================

    - name: Écrire l'IngressRoute HTTPS Nextcloud
      ansible.builtin.copy:
        dest: /tmp/nextcloud-ingressroute-https.yml
        mode: '0644'
        content: |
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: {{ app_name }}-headers
            namespace: {{ target_namespace }}
          spec:
            headers:
              customRequestHeaders:
                X-Forwarded-Proto: "https"
              stsSeconds: 15552000
              stsIncludeSubdomains: true
              stsPreload: true
          ---
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: {{ app_name }}-redirectregex
            namespace: {{ target_namespace }}
          spec:
            redirectRegex:
              permanent: true
              regex: "https://(.*)/.well-known/(?:card|cal)dav"
              replacement: "https://${1}/remote.php/dav"
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: {{ app_name }}-https
            namespace: {{ target_namespace }}
          spec:
            entryPoints:
              - websecure
            routes:
              - match: "Host(`{{ external_domains.nextcloud }}`)"
                kind: Rule
                middlewares:
                  - name: {{ app_name }}-headers
                  - name: {{ app_name }}-redirectregex
                services:
                  - name: {{ app_name }}-service
                    port: 80
            tls:
              secretName: {{ app_name }}-tls
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    - name: Appliquer l'IngressRoute HTTPS Nextcloud
      ansible.builtin.command: k3s kubectl apply -f /tmp/nextcloud-ingressroute-https.yml
      register: ingressroute_apply
      changed_when: "'configured' in ingressroute_apply.stdout or 'created' in ingressroute_apply.stdout"
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    - name: Supprimer le fichier IngressRoute temporaire
      ansible.builtin.file:
        path: /tmp/nextcloud-ingressroute-https.yml
        state: absent
      tags: [nextcloud, nextcloud-ingress, letsencrypt-tls]

    # ==========================================================
    # VÉRIFICATION
    # ==========================================================

    - name: Attendre que tous les pods Nextcloud soient Ready
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Ready pods
        --all -n {{ target_namespace }}
        --timeout=300s
      register: nextcloud_pods_ready
      changed_when: false
      tags: [nextcloud, nextcloud-verify]

    - name: Vérifier les pods Nextcloud
      ansible.builtin.command: k3s kubectl get pods -n {{ target_namespace }} -o wide
      register: nextcloud_pods
      changed_when: false
      tags: [nextcloud, nextcloud-verify]

    - name: Vérifier les services Nextcloud
      ansible.builtin.command: k3s kubectl get svc -n {{ target_namespace }}
      register: nextcloud_svc
      changed_when: false
      tags: [nextcloud, nextcloud-verify]

    - name: Vérifier les PVC Nextcloud
      ansible.builtin.command: k3s kubectl get pvc -n {{ target_namespace }}
      register: nextcloud_pvc
      changed_when: false
      tags: [nextcloud, nextcloud-verify]

    - name: Vérifier l'Ingress Nextcloud
      ansible.builtin.command: k3s kubectl get ingress -n {{ target_namespace }}
      register: nextcloud_ingress
      changed_when: false
      tags: [nextcloud, nextcloud-verify]

    - name: Vérifier le certificat Nextcloud
      ansible.builtin.command: k3s kubectl get certificate -n {{ target_namespace }}
      register: nextcloud_cert
      changed_when: false
      failed_when: false
      tags: [nextcloud, nextcloud-verify]

    # ==========================================================
    # LDAP / ACTIVE DIRECTORY
    # ==========================================================
    # Compte de service : s_next_ad (lecture seule sur l'annuaire)
    # Le compte est créé dans le DC via samba-tool depuis le pod NAS
    # Nextcloud utilise user_ldap pour authentifier les utilisateurs AD
    # ==========================================================

    - name: Créer le compte de service AD pour Nextcloud ({{ nextcloud_config.ldap_bind_user }})
      ansible.builtin.shell: |
        k3s kubectl exec -n nas deployment/samba -- \
          samba-tool user add {{ nextcloud_config.ldap_bind_user }} \
          '{{ nextcloud_config.ldap_bind_password }}' \
          --description="Nextcloud LDAP bind account (read-only)" \
          --server={{ nas_config.ad_dc_hostname }} \
          -U {{ nas_config.ad_join_user }}%{{ nas_config.ad_join_password }}
      register: ad_user_create
      failed_when: ad_user_create.rc != 0 and 'already exists' not in ad_user_create.stderr
      changed_when: ad_user_create.rc == 0
      tags: [nextcloud, nextcloud-ldap]

    - name: Désactiver l'expiration du mot de passe pour {{ nextcloud_config.ldap_bind_user }}
      ansible.builtin.shell: |
        k3s kubectl exec -n nas deployment/samba -- \
          samba-tool user setexpiry {{ nextcloud_config.ldap_bind_user }} --noexpiry \
          --server={{ nas_config.ad_dc_hostname }} \
          -U {{ nas_config.ad_join_user }}%{{ nas_config.ad_join_password }}
      changed_when: true
      tags: [nextcloud, nextcloud-ldap]

    - name: Attendre que Nextcloud soit prêt pour la configuration LDAP
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Ready pods
        -l app={{ app_name }}
        -n {{ target_namespace }}
        --timeout=300s
      changed_when: false
      tags: [nextcloud, nextcloud-ldap]

    - name: Activer l'app user_ldap dans Nextcloud
      ansible.builtin.shell: >
        k3s kubectl exec -n {{ target_namespace }} deployment/{{ app_name }} --
        su -s /bin/bash www-data -c "php /var/www/html/occ app:enable user_ldap"
      register: ldap_enable
      changed_when: "'enabled' in ldap_enable.stdout"
      tags: [nextcloud, nextcloud-ldap]

    - name: Créer la configuration LDAP s01
      ansible.builtin.shell: >
        k3s kubectl exec -n {{ target_namespace }} deployment/{{ app_name }} --
        su -s /bin/bash www-data -c "php /var/www/html/occ ldap:create-empty-config"
      register: ldap_config_create
      failed_when: ldap_config_create.rc != 0 and 'already exists' not in ldap_config_create.stderr
      changed_when: ldap_config_create.rc == 0
      tags: [nextcloud, nextcloud-ldap]

    - name: Configurer le backend LDAP (connexion AD)
      ansible.builtin.shell: >
        k3s kubectl exec -n {{ target_namespace }} deployment/{{ app_name }} --
        su -s /bin/bash www-data -c
        "php /var/www/html/occ ldap:set-config s01 {{ item.key }} '{{ item.value }}'"
      loop:
        - { key: ldapHost, value: "{{ nas_config.ad_dc_ip }}" }
        - { key: ldapPort, value: "389" }
        - { key: ldapAgentName, value: "{{ ldap_bind_dn }}" }
        - { key: ldapAgentPassword, value: "{{ nextcloud_config.ldap_bind_password }}" }
        - { key: ldapBase, value: "{{ ldap_base_dn }}" }
        - { key: ldapBaseUsers, value: "{{ ldap_users_dn }}" }
        - { key: ldapBaseGroups, value: "{{ ldap_users_dn }}" }
        - { key: ldapUserFilter, value: "(&(objectClass=user)(!(objectClass=computer)))" }
        - { key: ldapUserFilterObjectclass, value: "user" }
        - { key: ldapLoginFilter, value: "(&(objectClass=user)(sAMAccountName=%uid))" }
        - { key: ldapLoginFilterUsername, value: "1" }
        - { key: ldapGroupFilter, value: "(objectClass=group)" }
        - { key: ldapGroupFilterObjectclass, value: "group" }
        - { key: ldapUserDisplayName, value: "displayName" }
        - { key: ldapEmailAttribute, value: "mail" }
        - { key: ldapExpertUsernameAttr, value: "sAMAccountName" }
        - { key: turnOffCertCheck, value: "1" }
        - { key: ldapConfigurationActive, value: "1" }
      loop_control:
        label: "{{ item.key }}"
      changed_when: true
      tags: [nextcloud, nextcloud-ldap]

    - name: Vérifier la connexion LDAP
      ansible.builtin.shell: >
        k3s kubectl exec -n {{ target_namespace }} deployment/{{ app_name }} --
        su -s /bin/bash www-data -c "php /var/www/html/occ ldap:test-config s01"
      register: ldap_test
      changed_when: false
      tags: [nextcloud, nextcloud-ldap]

    - name: Afficher le résultat du test LDAP
      ansible.builtin.debug:
        msg: "{{ ldap_test.stdout_lines }}"
      tags: [nextcloud, nextcloud-ldap]

    # ==========================================================
    # RÉSUMÉ
    # ==========================================================

    - name: Résumé Nextcloud
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "  Nextcloud déployé"
          - "================================================================"
          - "Namespace    : {{ target_namespace }}"
          - "URL publique : https://{{ external_domains.nextcloud }}"
          - "TLS          : cert-manager / letsencrypt-production (ECDSA P-256)"
          - "PostgreSQL   : postgres:16-bookworm ({{ db_storage_size }})"
          - "Data         : {{ data_storage_size }} ({{ storage_class }})"
          - "Upload max   : 10 Go"
          - "LDAP/AD      : {{ nas_config.ad_dc_hostname }} ({{ nas_config.ad_dc_ip }}:389)"
          - "LDAP bind    : {{ nextcloud_config.ldap_bind_user }}"
          - "================================================================"
          - "  Pods"
          - "================================================================"
          - "{{ nextcloud_pods.stdout_lines }}"
          - "================================================================"
