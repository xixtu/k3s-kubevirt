---
# =============================================================
# PLAYBOOK : Installation Longhorn - Stockage distribué 3 tiers
# =============================================================
# Usage : ansible-playbook -i inventory/hosts.yml playbooks/longhorn.yml
# Tags :
#   longhorn-install → Installer Longhorn via Helm
#   longhorn-disks   → Configurer les 3 disques par nœud (ultra/fast/slow)
#   longhorn-storage → Créer les StorageClasses
#   longhorn-ingress → IngressRoute UI Longhorn
#   longhorn-verify  → Vérifier pods, disques, StorageClasses
# Prérequis :
#   - K3s installé + k3s_storage_setup.yml exécuté (répertoires Longhorn créés)
#   - MetalLB + Traefik installés (pour IngressRoute UI)
# URL interne  : http://longhorn.app.corp.lcl
# URL publique : https://longhorn.app.xixtu.eu
# =============================================================

# =============================================================
# PLAY 1 : Installation Longhorn via Helm
# =============================================================
- name: "Longhorn - Installation via Helm"
  hosts: k3s-node-1
  become: true
  gather_facts: false
  vars_files:
    - "../group_vars/k3s_cluster.yml"

  tasks:

    # ==========================================================
    # PRÉPARATION
    # ==========================================================

    - name: Ajouter le repo Helm Longhorn
      ansible.builtin.command: helm repo add longhorn https://charts.longhorn.io
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [longhorn, longhorn-install]

    - name: Mettre à jour les repos Helm
      ansible.builtin.command: helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [longhorn, longhorn-install]

    - name: Vérifier si Longhorn est déjà installé
      ansible.builtin.command: helm status longhorn -n longhorn-system
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: longhorn_helm_status
      failed_when: false
      changed_when: false
      tags: [longhorn, longhorn-install]

    # ==========================================================
    # FICHIER DE VALEURS HELM
    # ==========================================================

    - name: Ecrire le fichier de valeurs Longhorn
      ansible.builtin.copy:
        dest: /tmp/longhorn-values.yml
        mode: '0644'
        content: |
          persistence:
            defaultClass: false
            defaultClassReplicaCount: {{ longhorn_config.default_replica_count }}
            defaultFsType: ext4
            defaultDataLocality: best-effort
            reclaimPolicy: Delete
          defaultSettings:
            createDefaultDiskLabeledNodes: true
            defaultReplicaCount: {{ longhorn_config.default_replica_count }}
            storageOverProvisioningPercentage: {{ longhorn_config.storage_over_provisioning_percentage }}
            storageMinimalAvailablePercentage: {{ longhorn_config.storage_minimal_available_percentage }}
            guaranteedEngineManagerCPU: {{ longhorn_config.guaranteed_engine_manager_cpu }}
            guaranteedReplicaManagerCPU: {{ longhorn_config.guaranteed_replica_manager_cpu }}
            replicaSoftAntiAffinity: true
            replicaAutoBalance: best-effort
          longhornUI:
            replicas: 1
          ingress:
            enabled: false
      tags: [longhorn, longhorn-install]

    # ==========================================================
    # INSTALLATION LONGHORN
    # ==========================================================

    - name: Installer / Mettre à jour Longhorn via Helm
      ansible.builtin.command: >
        helm upgrade --install longhorn longhorn/longhorn
        --namespace longhorn-system
        --create-namespace
        --version {{ longhorn_version }}
        --values /tmp/longhorn-values.yml
        --wait
        --timeout 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [longhorn, longhorn-install]

    - name: Supprimer le fichier de valeurs temporaire
      ansible.builtin.file:
        path: /tmp/longhorn-values.yml
        state: absent
      tags: [longhorn, longhorn-install]

    # ==========================================================
    # ATTENTE DES COMPOSANTS
    # ==========================================================

    - name: Attendre que les pods Longhorn soient Ready
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Ready pods
        --all -n longhorn-system
        --timeout=300s
      register: longhorn_pods_ready
      changed_when: false
      retries: 3
      delay: 15
      until: longhorn_pods_ready.rc == 0
      tags: [longhorn, longhorn-install]

    - name: Attendre que le CRD nodes.longhorn.io soit établi
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Established
        crd/nodes.longhorn.io
        --timeout=120s
      changed_when: false
      tags: [longhorn, longhorn-install]

# =============================================================
# PLAY 2 : Configuration des disques par nœud (3 tiers)
# =============================================================
- name: "Longhorn - Configuration des disques par nœud"
  hosts: k3s-node-1
  become: true
  gather_facts: false
  vars_files:
    - "../group_vars/k3s_cluster.yml"

  tasks:

    - name: Pause pour laisser Longhorn découvrir les nœuds
      ansible.builtin.pause:
        seconds: 30
      tags: [longhorn, longhorn-disks]

    - name: Attendre que les Longhorn nodes existent
      ansible.builtin.command: >
        k3s kubectl get nodes.longhorn.io {{ item }} -n longhorn-system
      loop:
        - k3s-node-1
        - k3s-node-2
        - k3s-node-3
      register: longhorn_nodes_check
      changed_when: false
      retries: 12
      delay: 10
      until: longhorn_nodes_check is not failed
      tags: [longhorn, longhorn-disks]

    # ---------------------------------------------------------
    # PATCH DISQUES : 3 disques par nœud avec tags
    # Le merge patch remplace spec.disks → supprime le défaut
    # ---------------------------------------------------------

    - name: Écrire le patch disques pour chaque nœud
      ansible.builtin.copy:
        dest: "/tmp/longhorn-disk-patch-{{ item }}.yml"
        mode: '0644'
        content: |
          spec:
            disks:
              disk-ultra:
                allowScheduling: true
                evictionRequested: false
                path: "{{ longhorn_config.disk_paths.ultra }}"
                storageReserved: 0
                tags:
                  - ultra
              disk-fast:
                allowScheduling: true
                evictionRequested: false
                path: "{{ longhorn_config.disk_paths.fast }}"
                storageReserved: 0
                tags:
                  - fast
              disk-slow:
                allowScheduling: true
                evictionRequested: false
                path: "{{ longhorn_config.disk_paths.slow }}"
                storageReserved: 0
                tags:
                  - slow
      loop:
        - k3s-node-1
        - k3s-node-2
        - k3s-node-3
      tags: [longhorn, longhorn-disks]

    - name: Appliquer le patch disques sur chaque nœud Longhorn
      ansible.builtin.command: >
        k3s kubectl -n longhorn-system patch nodes.longhorn.io {{ item }}
        --type merge --patch-file /tmp/longhorn-disk-patch-{{ item }}.yml
      loop:
        - k3s-node-1
        - k3s-node-2
        - k3s-node-3
      register: disk_patch_result
      changed_when: "'patched' in disk_patch_result.stdout"
      tags: [longhorn, longhorn-disks]

    - name: Supprimer les fichiers patch temporaires
      ansible.builtin.file:
        path: "/tmp/longhorn-disk-patch-{{ item }}.yml"
        state: absent
      loop:
        - k3s-node-1
        - k3s-node-2
        - k3s-node-3
      tags: [longhorn, longhorn-disks]

    - name: Vérifier les disques configurés sur chaque nœud
      ansible.builtin.command: >
        k3s kubectl get nodes.longhorn.io {{ item }} -n longhorn-system
        -o jsonpath='{.spec.disks}'
      loop:
        - k3s-node-1
        - k3s-node-2
        - k3s-node-3
      register: node_disks_check
      changed_when: false
      tags: [longhorn, longhorn-disks]

# =============================================================
# PLAY 3 : StorageClasses + IngressRoute + Vérification
# =============================================================
- name: "Longhorn - StorageClasses, IngressRoute et vérification"
  hosts: k3s-node-1
  become: true
  gather_facts: false
  vars_files:
    - "../group_vars/k3s_cluster.yml"

  tasks:

    # ==========================================================
    # STORAGECLASSES
    # ==========================================================

    - name: Retirer le flag default de local-path
      ansible.builtin.command: >
        k3s kubectl patch storageclass local-path
        -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
      register: patch_localpath
      changed_when: "'patched' in patch_localpath.stdout"
      failed_when: false
      tags: [longhorn, longhorn-storage]

    - name: Retirer le flag default de la StorageClass longhorn du chart
      ansible.builtin.command: >
        k3s kubectl patch storageclass longhorn
        -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
      register: patch_longhorn
      changed_when: "'patched' in patch_longhorn.stdout"
      failed_when: false
      tags: [longhorn, longhorn-storage]

    - name: Ecrire le manifeste des StorageClasses Longhorn
      ansible.builtin.copy:
        dest: /tmp/longhorn-storageclasses.yml
        mode: '0644'
        content: "{% for sc in longhorn_storage_classes %}---\napiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: {{ sc.name }}\n  annotations:\n    storageclass.kubernetes.io/is-default-class: \"{{ sc.default | lower }}\"\nprovisioner: driver.longhorn.io\nallowVolumeExpansion: true\nreclaimPolicy: {{ sc.reclaim_policy }}\nvolumeBindingMode: Immediate\nparameters:\n  numberOfReplicas: \"{{ sc.replica_count }}\"\n  staleReplicaTimeout: \"2880\"\n  fromBackup: \"\"\n  fsType: \"{{ sc.fs_type }}\"\n  dataLocality: \"{{ sc.data_locality }}\"\n  diskSelector: \"{{ sc.disk_selector }}\"\n{% endfor %}"
      tags: [longhorn, longhorn-storage]

    - name: Appliquer les StorageClasses Longhorn
      ansible.builtin.command: k3s kubectl apply -f /tmp/longhorn-storageclasses.yml
      register: sc_apply
      changed_when: "'configured' in sc_apply.stdout or 'created' in sc_apply.stdout"
      tags: [longhorn, longhorn-storage]

    - name: Supprimer le fichier StorageClasses temporaire
      ansible.builtin.file:
        path: /tmp/longhorn-storageclasses.yml
        state: absent
      tags: [longhorn, longhorn-storage]

    # ==========================================================
    # INGRESSROUTE LONGHORN UI (interne - app.corp.lcl)
    # ==========================================================

    - name: Écrire l'IngressRoute interne Longhorn UI
      ansible.builtin.copy:
        dest: /tmp/longhorn-ingressroute.yml
        mode: '0644'
        content: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: longhorn-ui
            namespace: longhorn-system
          spec:
            entryPoints:
              - web
            routes:
              - match: Host(`longhorn.{{ cluster_network.apps_domain }}`)
                kind: Rule
                services:
                  - name: longhorn-frontend
                    port: 80
                # TODO: Ajouter middleware Authelia quand disponible
                # middlewares:
                #   - name: authelia
                #     namespace: authelia
      tags: [longhorn, longhorn-ingress]

    - name: Appliquer l'IngressRoute interne Longhorn UI
      ansible.builtin.command: k3s kubectl apply -f /tmp/longhorn-ingressroute.yml
      changed_when: false
      tags: [longhorn, longhorn-ingress]

    - name: Supprimer le fichier IngressRoute temporaire
      ansible.builtin.file:
        path: /tmp/longhorn-ingressroute.yml
        state: absent
      tags: [longhorn, longhorn-ingress]

    # ==========================================================
    # TLS - CERTIFICAT LET'S ENCRYPT (longhorn.app.xixtu.eu)
    # ==========================================================
    # Pattern : Ingress K8s (déclenche cert-manager) + IngressRoute HTTPS
    # Le middleware redirect-to-https redirige HTTP→HTTPS sur l'Ingress,
    # mais n'affecte PAS le solver cert-manager (Ingress temporaire séparé).
    # ==========================================================

    - name: Créer l'Ingress Longhorn (cert-manager + redirect HTTP→HTTPS)
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: longhorn-ingress-tls
            namespace: longhorn-system
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-production
              cert-manager.io/private-key-algorithm: "ECDSA"
              cert-manager.io/private-key-size: "256"
              traefik.ingress.kubernetes.io/router.entrypoints: "web"
              traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-to-https@kubernetescrd"
          spec:
            ingressClassName: traefik
            tls:
              - hosts:
                  - "{{ external_domains.longhorn }}"
                secretName: longhorn-tls
            rules:
              - host: "{{ external_domains.longhorn }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: longhorn-frontend
                          port:
                            number: 80
      tags: [longhorn, longhorn-ingress, letsencrypt-tls]

    - name: Vérifier le type de clé du certificat Longhorn actuel
      ansible.builtin.shell: >
        k3s kubectl get secret longhorn-tls -n longhorn-system
        -o jsonpath='{.data.tls\.key}' | base64 -d
        | openssl ec -noout 2>/dev/null && echo "ECDSA" || echo "RSA"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: longhorn_cert_key_type
      changed_when: false
      failed_when: false
      tags: [longhorn, longhorn-ingress, letsencrypt-tls]

    - name: Supprimer l'ancien certificat RSA Longhorn pour renouvellement ECDSA
      ansible.builtin.command: >
        k3s kubectl delete certificate longhorn-tls
        -n longhorn-system --ignore-not-found
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: longhorn_cert_key_type.stdout is defined and 'ECDSA' not in longhorn_cert_key_type.stdout
      changed_when: true
      tags: [longhorn, longhorn-ingress, letsencrypt-tls]

    - name: Supprimer l'ancien secret TLS RSA Longhorn
      ansible.builtin.command: >
        k3s kubectl delete secret longhorn-tls
        -n longhorn-system --ignore-not-found
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: longhorn_cert_key_type.stdout is defined and 'ECDSA' not in longhorn_cert_key_type.stdout
      changed_when: true
      tags: [longhorn, longhorn-ingress, letsencrypt-tls]

    - name: Créer l'IngressRoute HTTPS Longhorn (websecure)
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: longhorn-https
            namespace: longhorn-system
          spec:
            entryPoints:
              - websecure
            routes:
              - match: "Host(`{{ external_domains.longhorn }}`)"
                kind: Rule
                services:
                  - name: longhorn-frontend
                    port: 80
            tls:
              secretName: longhorn-tls
      tags: [longhorn, longhorn-ingress, letsencrypt-tls]

    # ==========================================================
    # VÉRIFICATION
    # ==========================================================

    - name: Vérifier les pods Longhorn
      ansible.builtin.command: k3s kubectl get pods -n longhorn-system -o wide
      register: longhorn_pods
      changed_when: false
      tags: [longhorn, longhorn-verify]

    - name: Vérifier les StorageClasses
      ansible.builtin.command: k3s kubectl get storageclass
      register: storage_classes
      changed_when: false
      tags: [longhorn, longhorn-verify]

    - name: Vérifier les nœuds Longhorn et disques
      ansible.builtin.command: >
        k3s kubectl get nodes.longhorn.io -n longhorn-system -o wide
      register: longhorn_nodes
      changed_when: false
      tags: [longhorn, longhorn-verify]

    - name: Vérifier l'IngressRoute Longhorn
      ansible.builtin.command: >
        k3s kubectl get ingressroute -n longhorn-system
      register: longhorn_ingress
      changed_when: false
      failed_when: false
      tags: [longhorn, longhorn-verify]

    - name: Vérifier que les volumes sont programmables
      ansible.builtin.shell: >
        k3s kubectl get nodes.longhorn.io -n longhorn-system
        -o jsonpath='{range .items[*]}{.metadata.name}{": schedulable="}{.status.conditions[?(@.type=="Schedulable")].status}{"\n"}{end}'
      register: schedulable_check
      changed_when: false
      tags: [longhorn, longhorn-verify]

    # ==========================================================
    # RÉSUMÉ
    # ==========================================================

    - name: Résumé Longhorn
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "  Longhorn v{{ longhorn_version }} installé"
          - "================================================"
          - "Namespace    : longhorn-system"
          - "Replicas     : {{ longhorn_config.default_replica_count }}"
          - "UI interne   : http://longhorn.{{ cluster_network.apps_domain }}"
          - "UI publique  : https://{{ external_domains.longhorn }}"
          - "TLS          : cert-manager / letsencrypt-production (ECDSA P-256)"
          - "================================================"
          - "  StorageClasses"
          - "================================================"
          - "{{ storage_classes.stdout_lines }}"
          - "================================================"
          - "  Disques par noeud (3 tiers)"
          - "================================================"
          - "Ultra : {{ longhorn_config.disk_paths.ultra }} (tag: ultra)"
          - "Fast  : {{ longhorn_config.disk_paths.fast }} (tag: fast)"
          - "Slow  : {{ longhorn_config.disk_paths.slow }} (tag: slow)"
          - "================================================"
          - "  Noeuds Longhorn"
          - "================================================"
          - "{{ longhorn_nodes.stdout_lines }}"
          - "Schedulable  : {{ schedulable_check.stdout_lines }}"
          - "================================================"
          - "  Pods"
          - "================================================"
          - "{{ longhorn_pods.stdout_lines }}"
          - "================================================"
          - "  Authelia : middleware a ajouter quand disponible"
          - "================================================"
      tags: [longhorn, longhorn-verify]
