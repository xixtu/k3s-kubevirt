apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paheko-ingress-debug
  namespace: paheko
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  tls:
  - hosts:
    - paheko.app.xixtu.eu
    secretName: paheko-tls
  rules:
  - host: paheko.app.xixtu.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paheko-service
            port:
              number: 80