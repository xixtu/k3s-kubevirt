          - "PrometheusRule : {{ longhorn_prometheusrules.stdout_lines | default(['Non trouvé']) }}"
          - "Dashboard      : longhorn-grafana-dashboard (ConfigMap, ID 17626)"
          - "================================================"
      tags: [monitoring, monitoring-verify]
