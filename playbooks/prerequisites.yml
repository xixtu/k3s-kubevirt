---
# =============================================================
# PLAYBOOK : Prérequis système + Git + Helm
# =============================================================
# Usage : ansible-playbook -i inventory/hosts.yml playbooks/prerequisites.yml
# Tags :
#   apt       → Mise à jour système + packages
#   git       → Installation et vérification Git
#   system    → Timezone, hostname, swap, /etc/hosts
#   kernel    → Modules kernel K3s/KubeVirt
#   sysctl    → Tuning réseau et VM
#   iscsi     → Service open-iscsi (requis Longhorn)
#   helm      → Installation Helm
#   verify    → Vérification finale
# =============================================================

- name: Installation prérequis système, Git et Helm
  hosts: k3s_cluster
  become: true
  gather_facts: true
  vars_files:
    - "../group_vars/k3s_cluster.yml"
  tasks:

    # =========================================================
    # SYSTÈME DE BASE
    # =========================================================

    - name: Mise à jour du cache apt
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: [prereq, apt]

    - name: Mise à jour complète du système
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
      tags: [prereq, apt]

    - name: Installation des packages essentiels
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
      tags: [prereq, apt, packages]

    - name: Installation Git
      ansible.builtin.apt:
        name:
          - git
          - git-lfs
        state: present
      tags: [prereq, git]

    - name: Vérifier version Git
      ansible.builtin.command: git --version
      register: git_version
      changed_when: false
      tags: [prereq, git]

    - name: Afficher version Git
      ansible.builtin.debug:
        msg: "Git installé : {{ git_version.stdout }}"
      tags: [prereq, git]

    # =========================================================
    # CONFIGURATION SYSTÈME
    # =========================================================

    - name: Configurer timezone
      community.general.timezone:
        name: "{{ system_config.timezone }}"
      tags: [prereq, system]

    - name: Désactiver swap (requis K8s)
      ansible.builtin.command: swapoff -a
      when: system_config.swapoff
      changed_when: false
      tags: [prereq, system]

    - name: Désactiver swap dans fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'
      when: system_config.swapoff
      tags: [prereq, system]

    - name: Configurer hostname
      ansible.builtin.hostname:
        name: "{{ node_name }}"
      tags: [prereq, system]

    - name: Mettre à jour /etc/hosts avec les IPs bond0 (statiques)
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: ".*{{ item.name }}$"
        line: "{{ item.ip }}    {{ item.name }}"
        state: present
      loop:
        - { ip: "192.168.0.11", name: "k3s-node-1" }
        - { ip: "192.168.0.12", name: "k3s-node-2" }
        - { ip: "192.168.0.13", name: "k3s-node-3" }
      tags: [prereq, system]

    # =========================================================
    # MODULES KERNEL
    # =========================================================

    - name: Charger les modules kernel requis
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ kernel_modules }}"
      tags: [prereq, kernel]

    - name: Rendre les modules persistants
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s-kubevirt.conf
        content: |
          # Modules K3s + KubeVirt
          {% for module in kernel_modules %}
          {{ module }}
          {% endfor %}
        mode: '0644'
      tags: [prereq, kernel]

    # =========================================================
    # SYSCTL TUNING
    # =========================================================

    - name: Configurer sysctl
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-k3s.conf
      loop: "{{ sysctl_settings | dict2items }}"
      tags: [prereq, sysctl]

    # =========================================================
    # OPEN-ISCSI (requis pour Longhorn)
    # =========================================================

    - name: Activer et démarrer iscsid
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: yes
      tags: [prereq, iscsi]

    # =========================================================
    # HELM
    # =========================================================

    - name: Vérifier si Helm est déjà installé
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_binary
      tags: [prereq, helm]

    - name: Télécharger et installer Helm
      ansible.builtin.shell: |
        curl -sfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: not helm_binary.stat.exists
      tags: [prereq, helm]

    - name: Vérifier version Helm
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false
      tags: [prereq, helm]

    - name: Afficher version Helm
      ansible.builtin.debug:
        msg: "Helm installé : {{ helm_version.stdout }}"
      tags: [prereq, helm]

    # =========================================================
    # VÉRIFICATION FINALE
    # =========================================================

    - name: Vérifier modules chargés
      ansible.builtin.shell: lsmod | grep -E "{{ kernel_modules | join('|') }}"
      register: modules_check
      changed_when: false
      failed_when: false
      tags: [prereq, verify]

    - name: Résumé prérequis
      ansible.builtin.debug:
        msg:
          - "=== Prérequis OK sur {{ inventory_hostname }} ==="
          - "Git     : {{ git_version.stdout }}"
          - "Helm    : {{ helm_version.stdout }}"
          - "Hostname: {{ node_name }}"
          - "Swap    : désactivé"
          - "Modules : chargés"
          - "iSCSI   : actif"
      tags: [prereq, verify]

# =========================================================
    # INSTALLATION DES DÉPENDANCES PYTHON (Vos commandes)
    # =========================================================
    
    - name: Installation du paquet python3-kubernetes
      ansible.builtin.apt:
        name: python3-kubernetes
        state: present
        update_cache: yes
      tags: [setup, python]