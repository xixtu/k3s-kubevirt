---
# =============================================================
# PLAYBOOK : PrestaShop - Boutique e-commerce café capsules
# =============================================================
# Usage : ansible-playbook -i inventory/hosts.yml playbooks/prestashop.yml
# Tags :
#   prestashop-install → Déployer PrestaShop + MariaDB (manifests kubectl)
#   prestashop-tls     → Forcer renouvellement certificat ECDSA P-384
#   prestashop-verify  → Vérifier pods, PVCs, Ingress, certificat, HPA
#
# Images Docker officielles (Docker Hub - gratuites) :
#   prestashop/prestashop:{{ prestashop_version }}  (officiel PrestaShop)
#   mariadb:{{ prestashop_config.mariadb_image_tag }}          (officiel MariaDB)
#   busybox:1.36                                    (init container wait DB)
#
# Architecture :
#   [init] busybox wait-for-mariadb (nc -z :3306)
#   MariaDB Deployment  → ClusterIP :3306 (interne uniquement)
#   PrestaShop Deployment → ClusterIP :80  → Ingress + IngressRoute
#   Ingress standard    → HTTP-01 challenge cert-manager (port 80)
#   IngressRoute CRD    → HTTPS websecure + security-headers middleware
#   HPA                 → min=1 max=3 CPU=70% Memory=80%
#
# Fonctionnalités e-commerce incluses :
#   ✓ Catalogue   : variantes (mouture), collections (origine), images multiples
#   ✓ Stock       : inventaire par variante, alertes seuil
#   ✓ Commandes   : pipeline complet panier → paiement → expédition → livré
#   ✓ Paiements   : virement, chèque, cash natifs + Wero/Stripe via modules
#   ✓ Clients     : comptes, historique, groupes (pro/particulier)
#   ✓ Livraison   : zones, transporteurs, calcul frais de port
#   ✓ Retours     : RMA natif, remboursements
#   ✓ Promotions  : codes promo, réductions automatiques
#   ✓ SEO         : URLs rewriting, meta, sitemap
#
# URL publique  : https://barista.app.xixtu.eu
# Admin panel   : https://barista.app.xixtu.eu/admin-barista
#
# Prérequis :
#   - K3s + MetalLB + Traefik + cert-manager installés
#   - DNS : barista.app.xixtu.eu → <IP publique Traefik>
#   - Ports 80 et 443 accessibles depuis Internet (challenge HTTP-01)
#
# ⚠ PSA (Pod Security Admission) :
#   PrestaShop tourne via Apache en tant que www-data (uid 33).
#   Le namespace est labellisé 'baseline' pour autoriser ce mode de
#   fonctionnement tout en bloquant les usages réellement privilégiés.
#
# ⚠ SSL Offloading :
#   Traefik termine TLS et forward en HTTP vers PrestaShop (port 80).
#   PS_ENABLE_SSL=1 configure l'URL de la boutique en https://.
#   Apache reçoit les requêtes HTTP avec X-Forwarded-Proto: https.
#
# ⚠ Premier démarrage :
#   PS_INSTALL_AUTO=1 + PS_INSTALL_DB=1 lancent l'installation complète.
#   Durée estimée : 5 à 15 minutes selon les ressources disponibles.
#   PS_ERASE_DB=0 garantit que les redémarrages ne réinstallent pas.
#
# ⚠ HPA et scaling horizontal :
#   Scaling multi-pods nécessite sessions Redis + PVC ReadWriteMany.
#   Par défaut : 1 replica, HPA actif mais borné par RWO storage.
# =============================================================

- name: "PrestaShop - Boutique e-commerce café capsules Barista"
  hosts: k3s-node-1
  become: true
  gather_facts: false
  vars_files:
    - "../group_vars/k3s_cluster.yml"

  tasks:

    # ==========================================================
    # NAMESPACE + PSA LABEL
    # ==========================================================

    - name: Créer le namespace prestashop (si absent)
      ansible.builtin.command: k3s kubectl create namespace prestashop
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: ns_create
      failed_when: ns_create.rc != 0 and 'already exists' not in ns_create.stderr
      changed_when: ns_create.rc == 0
      tags: [prestashop, prestashop-install, prestashop-tls]

    - name: Labelliser le namespace prestashop (PSA baseline - Apache www-data)
      ansible.builtin.command: >
        k3s kubectl label namespace prestashop
        pod-security.kubernetes.io/enforce=baseline
        pod-security.kubernetes.io/warn=baseline
        pod-security.kubernetes.io/audit=baseline
        --overwrite
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [prestashop, prestashop-install, prestashop-tls]

    # ==========================================================
    # MANIFESTS KUBERNETES (Secrets, PVCs, Deployments, Services)
    # ==========================================================

    - name: Écrire les manifests PrestaShop (Secret + PVCs + MariaDB + App)
      ansible.builtin.copy:
        dest: /tmp/prestashop-stack.yml
        mode: '0600'
        content: |
          # ==========================================================
          # SECRET : Mots de passe (base64 via stringData → Opaque)
          # ==========================================================
          apiVersion: v1
          kind: Secret
          metadata:
            name: prestashop-secret
            namespace: prestashop
            labels:
              app: prestashop
          type: Opaque
          stringData:
            db-root-password: "{{ prestashop_config.db_root_password }}"
            db-password: "{{ prestashop_config.db_password }}"
            admin-password: "{{ prestashop_config.admin_password }}"
          ---
          # ==========================================================
          # PVC : Base de données MariaDB (longhorn-fast)
          # ==========================================================
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: prestashop-db-pvc
            namespace: prestashop
            labels:
              app: prestashop
              tier: database
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: longhorn-fast
            resources:
              requests:
                storage: "{{ prestashop_config.db_storage_size }}"
          ---
          # ==========================================================
          # PVC : Données applicatives PrestaShop (thèmes, modules, médias)
          # ==========================================================
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: prestashop-data-pvc
            namespace: prestashop
            labels:
              app: prestashop
              tier: app
          spec:
            accessModes:
              ## ReadWriteOnce (1 pod) - migrer en ReadWriteMany pour HPA multi-pod
              ## Longhorn RWX disponible depuis v1.6 (NFS gateway)
              - ReadWriteOnce
            storageClassName: longhorn-fast
            resources:
              requests:
                storage: "{{ prestashop_config.data_storage_size }}"
          ---
          # ==========================================================
          # DEPLOYMENT : MariaDB 10.11 (base de données officielle)
          # ==========================================================
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: prestashop-mariadb
            namespace: prestashop
            labels:
              app: prestashop-mariadb
          spec:
            replicas: 1
            strategy:
              type: Recreate  # Recreate car RWO - un seul pod à la fois
            selector:
              matchLabels:
                app: prestashop-mariadb
            template:
              metadata:
                labels:
                  app: prestashop-mariadb
              spec:
                containers:
                  - name: mariadb
                    image: mariadb:{{ prestashop_config.mariadb_image_tag }}
                    ports:
                      - containerPort: 3306
                    env:
                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: prestashop-secret
                            key: db-root-password
                      - name: MYSQL_DATABASE
                        value: "{{ prestashop_config.db_name }}"
                      - name: MYSQL_USER
                        value: "{{ prestashop_config.db_user }}"
                      - name: MYSQL_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: prestashop-secret
                            key: db-password
                      ## Encodage UTF-8 complet (emojis, caractères spéciaux)
                      - name: MARIADB_CHARACTER_SET_SERVER
                        value: "utf8mb4"
                      - name: MARIADB_COLLATION_SERVER
                        value: "utf8mb4_unicode_ci"
                    volumeMounts:
                      - name: db-data
                        mountPath: /var/lib/mysql
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "256Mi"
                      limits:
                        cpu: "500m"
                        memory: "1Gi"
                    readinessProbe:
                      exec:
                        command:
                          - bash
                          - -c
                          - "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                    livenessProbe:
                      exec:
                        command:
                          - bash
                          - -c
                          - "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 5
                      failureThreshold: 3
                volumes:
                  - name: db-data
                    persistentVolumeClaim:
                      claimName: prestashop-db-pvc
          ---
          # ==========================================================
          # SERVICE : MariaDB (ClusterIP interne uniquement)
          # ==========================================================
          apiVersion: v1
          kind: Service
          metadata:
            name: prestashop-mariadb
            namespace: prestashop
            labels:
              app: prestashop-mariadb
          spec:
            selector:
              app: prestashop-mariadb
            ports:
              - name: mysql
                port: 3306
                targetPort: 3306
            type: ClusterIP
          ---
          # ==========================================================
          # DEPLOYMENT : PrestaShop (image officielle Docker Hub)
          # ==========================================================
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: prestashop
            namespace: prestashop
            labels:
              app: prestashop
          spec:
            replicas: 1
            strategy:
              type: Recreate  # Recreate car PVC RWO (1 seul pod à la fois)
            selector:
              matchLabels:
                app: prestashop
            template:
              metadata:
                labels:
                  app: prestashop
              spec:
                ## Init containers (exécutés dans l'ordre) :
                ##   1. cleanup-lock      : supprime les locks stales dans le PVC
                ##   2. wait-for-mariadb  : connexion MySQL réelle avant démarrage PS
                initContainers:
                  - name: cleanup-lock
                    image: alpine:3.19
                    command:
                      - sh
                      - -c
                      - |
                        echo "=== cleanup-lock : état de /var/www/html avant nettoyage ==="
                        ls -la /var/www/html/ 2>/dev/null || echo "(vide)"
                        echo "=== Fichiers *lock* détectés ==="
                        find /var/www/html -maxdepth 4 -name "*lock*" 2>/dev/null || echo "aucun"
                        echo "=== Nettoyage ==="
                        ## Pattern large : *lock* (et non *.lock) pour couvrir
                        ## ps-install.lock, setup_lock, lockfile, .lock, etc.
                        find /var/www/html -maxdepth 4 \
                          \( -name "*lock*" -o -name ".*lock*" \) \
                          -type f -delete 2>/dev/null || true
                        ## Suppressions explicites connues
                        rm -f /var/www/html/.setup_lock \
                              /var/www/html/.ps_lock \
                              /var/www/html/ps-install.lock \
                              /var/www/html/install/install.lock 2>/dev/null || true
                        echo "=== Nettoyage terminé ==="
                    volumeMounts:
                      - name: prestashop-data
                        mountPath: /var/www/html
                  - name: wait-for-mariadb
                    image: mariadb:{{ prestashop_config.mariadb_image_tag }}
                    command:
                      - bash
                      - -c
                      - |
                        echo "Attente MariaDB (connexion MySQL réelle)..."
                        until mysqladmin ping -h prestashop-mariadb -u root -p${MYSQL_ROOT_PASSWORD} --silent 2>/dev/null; do
                          echo "MariaDB pas encore prête, nouvelle tentative dans 3s..."
                          sleep 3
                        done
                        echo "MariaDB prête - connexion MySQL OK."
                    env:
                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: prestashop-secret
                            key: db-root-password
                containers:
                  - name: prestashop
                    image: prestashop/prestashop:{{ prestashop_version }}
                    ## Wrapper pour absorber le exit 42 (signal de redémarrage interne
                    ## du script /tmp/docker_run.sh de l'image officielle PrestaShop).
                    ## Sans wrapper, Kubernetes traite exit 42 comme un crash →
                    ## CrashLoopBackOff avec backoff exponentiel qui bloque l'install.
                    ## Le wrapper relance le script en interne jusqu'à ce qu'il quitte
                    ## avec un code autre que 42 (0 = Apache en cours, 1+ = erreur).
                    command:
                      - /bin/bash
                      - -c
                      - |
                        ## --- Diagnostic au démarrage (une seule fois) ---
                        echo "[wrapper] === Mécanisme de lock dans docker_run.sh ==="
                        grep -n "lock\|LOCK\|Another setup\|running\|SETUP" /tmp/docker_run.sh 2>/dev/null | head -30 || echo "grep: rien trouvé"
                        echo "[wrapper] === Fichiers /var/www/html au démarrage ==="
                        ls -la /var/www/html/ 2>/dev/null | head -20 || echo "(vide)"
                        echo "[wrapper] ==========================================="
                        ## --- Boucle principale ---
                        while true; do
                          ## Nettoyer AVANT chaque appel (couvre /tmp ET /var/www/html)
                          ## Le lock peut être dans /tmp (même session container) ou dans le PVC
                          find /var/www/html -maxdepth 4 \( -name "*lock*" -o -name ".*lock*" \) \
                            -type f -delete 2>/dev/null || true
                          find /tmp -maxdepth 2 \( -name "*lock*" -o -name ".*lock*" \) \
                            -type f -delete 2>/dev/null || true
                          bash /tmp/docker_run.sh
                          ec=$?
                          if [ "$ec" -eq 42 ]; then
                            echo "[wrapper] Exit 42 détecté. Locks résiduels :"
                            find /var/www/html -maxdepth 4 -name "*lock*" 2>/dev/null || echo "  /var/www/html : aucun"
                            find /tmp -maxdepth 2 -name "*lock*" 2>/dev/null || echo "  /tmp : aucun"
                            echo "[wrapper] Relance dans 5s..."
                            sleep 5
                          else
                            echo "[wrapper] Exit $ec - arrêt du wrapper."
                            exit $ec
                          fi
                        done
                    ports:
                      - containerPort: 80
                    env:
                      ## --- Connexion base de données ---
                      - name: DB_SERVER
                        value: "prestashop-mariadb"
                      - name: DB_PORT
                        value: "3306"
                      - name: DB_NAME
                        value: "{{ prestashop_config.db_name }}"
                      - name: DB_USER
                        value: "{{ prestashop_config.db_user }}"
                      - name: DB_PASSWD
                        valueFrom:
                          secretKeyRef:
                            name: prestashop-secret
                            key: db-password
                      - name: DB_PREFIX
                        value: "ps_"
                      ## --- Installation automatique ---
                      - name: PS_INSTALL_AUTO
                        value: "1"
                      - name: PS_INSTALL_DB
                        value: "1"
                      - name: PS_ERASE_DB
                        ## ⚠ NE PAS PASSER À 1 EN PRODUCTION
                        ## (efface toutes les données de la boutique)
                        value: "0"
                      ## --- Configuration boutique ---
                      - name: PS_DOMAIN
                        value: "{{ external_domains.barista }}"
                      - name: PS_LANGUAGE
                        value: "fr"
                      - name: PS_COUNTRY
                        value: "fr"
                      - name: PS_ENABLE_SSL
                        value: "1"
                      - name: PS_REWRITE_ENGINES
                        value: "1"
                      ## Dossier admin masqué (sécurité)
                      - name: PS_FOLDER_ADMIN
                        value: "admin-barista"
                      - name: PS_FOLDER_INSTALL
                        value: "install-barista"
                      ## --- Compte administrateur ---
                      - name: ADMIN_MAIL
                        value: "{{ letsencrypt_email }}"
                      - name: ADMIN_PASSWD
                        valueFrom:
                          secretKeyRef:
                            name: prestashop-secret
                            key: admin-password
                    volumeMounts:
                      ## Tout /var/www/html est persisté
                      ## (code PS, modules, thèmes, images produits, cache)
                      - name: prestashop-data
                        mountPath: /var/www/html
                    resources:
                      requests:
                        cpu: "{{ prestashop_config.resources.requests.cpu }}"
                        memory: "{{ prestashop_config.resources.requests.memory }}"
                      limits:
                        cpu: "{{ prestashop_config.resources.limits.cpu }}"
                        memory: "{{ prestashop_config.resources.limits.memory }}"
                    ## Probe liveness : délai long (installation DB au premier boot)
                    livenessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 600
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 6
                    ## Probe readiness : délai moyen (attendre que Apache réponde)
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 120
                      periodSeconds: 15
                      timeoutSeconds: 10
                      failureThreshold: 10
                volumes:
                  - name: prestashop-data
                    persistentVolumeClaim:
                      claimName: prestashop-data-pvc
          ---
          # ==========================================================
          # SERVICE : PrestaShop (ClusterIP - Traefik expose via Ingress)
          # ==========================================================
          apiVersion: v1
          kind: Service
          metadata:
            name: prestashop
            namespace: prestashop
            labels:
              app: prestashop
          spec:
            selector:
              app: prestashop
            ports:
              - name: http
                port: 80
                targetPort: 80
            type: ClusterIP
          ---
          # ==========================================================
          # INGRESS : Standard Kubernetes (HTTP-01 cert-manager + redirect)
          # ==========================================================
          # Rôle : déclarer le certificat TLS via annotations cert-manager
          # et servir de cible au solver HTTP-01 de Let's Encrypt (port 80).
          # La redirection HTTP→HTTPS est appliquée via le middleware Traefik
          # redirect-to-https (pas au niveau entrypoint pour ne pas bloquer
          # le solver cert-manager - cf. commentaire playbooks/letsencrypt.yml)
          # ==========================================================
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: prestashop
            namespace: prestashop
            labels:
              app: prestashop
            annotations:
              ## Entrypoint HTTP + redirect HTTPS via middleware
              traefik.ingress.kubernetes.io/router.entrypoints: web
              traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-to-https@kubernetescrd
              ## cert-manager : certificat ECDSA P-384 (Let's Encrypt production)
              cert-manager.io/cluster-issuer: letsencrypt-production
              cert-manager.io/private-key-algorithm: "ECDSA"
              cert-manager.io/private-key-size: "384"
              cert-manager.io/private-key-rotation-policy: "Always"
          spec:
            ingressClassName: traefik
            rules:
              - host: "{{ external_domains.barista }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: prestashop
                          port:
                            number: 80
            tls:
              - hosts:
                  - "{{ external_domains.barista }}"
                secretName: prestashop-tls
          ---
          # ==========================================================
          # HPA : HorizontalPodAutoscaler
          # ==========================================================
          # ⚠ Scaling réel multi-pods nécessite :
          #   1. PVC ReadWriteMany (Longhorn RWX NFS gateway)
          #   2. Sessions Redis (module PrestaShop Redis cache)
          #   Sans ces deux prérequis, laisser minReplicas=maxReplicas=1
          # ==========================================================
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: prestashop
            namespace: prestashop
            labels:
              app: prestashop
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: prestashop
            minReplicas: 1
            maxReplicas: 3
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 70
              - type: Resource
                resource:
                  name: memory
                  target:
                    type: Utilization
                    averageUtilization: 80
      tags: [prestashop, prestashop-install]

    # ==========================================================
    # APPLIQUER LES MANIFESTS
    # ==========================================================

    - name: Appliquer les manifests PrestaShop (Secret, PVCs, Deployments, Services, Ingress, HPA)
      ansible.builtin.command: k3s kubectl apply -f /tmp/prestashop-stack.yml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [prestashop, prestashop-install]

    - name: Supprimer le fichier manifests temporaire
      ansible.builtin.file:
        path: /tmp/prestashop-stack.yml
        state: absent
      tags: [prestashop, prestashop-install]

    # ==========================================================
    # RENOUVELLEMENT CERTIFICAT ECDSA (si ancien certificat RSA)
    # ==========================================================

    - name: Vérifier le type de clé du certificat actuel
      ansible.builtin.shell: >
        k3s kubectl get secret prestashop-tls -n prestashop -o jsonpath='{.data.tls\.key}'
        | base64 -d | openssl ec -noout 2>/dev/null && echo "ECDSA" || echo "RSA"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: cert_key_type
      changed_when: false
      failed_when: false
      tags: [prestashop, prestashop-install, prestashop-tls]

    - name: Supprimer l'ancien certificat RSA pour forcer le renouvellement ECDSA
      ansible.builtin.command: >
        k3s kubectl delete certificate prestashop-tls -n prestashop --ignore-not-found
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: cert_key_type.stdout is defined and 'ECDSA' not in cert_key_type.stdout
      changed_when: true
      tags: [prestashop, prestashop-install, prestashop-tls]

    - name: Supprimer l'ancien secret TLS RSA
      ansible.builtin.command: >
        k3s kubectl delete secret prestashop-tls -n prestashop --ignore-not-found
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: cert_key_type.stdout is defined and 'ECDSA' not in cert_key_type.stdout
      changed_when: true
      tags: [prestashop, prestashop-install, prestashop-tls]

    # ==========================================================
    # INGRESSROUTE HTTPS (Traefik CRD - router websecure explicite)
    # ==========================================================
    # L'IngressRoute CRD Traefik gère le routage HTTPS (entrypoint websecure)
    # avec TLS terminé par Traefik + security-headers (HSTS 2 ans, X-Frame, XSS).
    # Complément du standard Ingress qui gère HTTP-01 cert-manager + redirect.
    # ==========================================================

    - name: Écrire l'IngressRoute HTTPS PrestaShop
      ansible.builtin.copy:
        dest: /tmp/prestashop-ingressroute.yml
        mode: '0644'
        content: |
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: prestashop-https
            namespace: prestashop
            labels:
              app: prestashop
          spec:
            entryPoints:
              - websecure
            routes:
              - match: Host(`{{ external_domains.barista }}`)
                kind: Rule
                middlewares:
                  ## HSTS 2 ans, X-Frame-Options, XSS filter, nosniff, referrer
                  - name: security-headers
                    namespace: traefik
                services:
                  - name: prestashop
                    port: 80
            tls:
              secretName: prestashop-tls
      tags: [prestashop, prestashop-install]

    - name: Appliquer l'IngressRoute HTTPS PrestaShop
      ansible.builtin.command: k3s kubectl apply -f /tmp/prestashop-ingressroute.yml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
      tags: [prestashop, prestashop-install]

    - name: Supprimer le fichier IngressRoute temporaire
      ansible.builtin.file:
        path: /tmp/prestashop-ingressroute.yml
        state: absent
      tags: [prestashop, prestashop-install]

    # ==========================================================
    # VÉRIFICATION
    # ==========================================================

    - name: Attendre que MariaDB soit Ready
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Ready pods
        -l app=prestashop-mariadb
        -n prestashop
        --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: mariadb_ready
      changed_when: false
      tags: [prestashop, prestashop-verify]

    - name: Attendre que PrestaShop soit Ready (installation DB au 1er boot = ~10min)
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=Ready pods
        -l app=prestashop
        -n prestashop
        --timeout=1200s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: prestashop_ready
      changed_when: false
      tags: [prestashop, prestashop-verify]

    - name: Vérifier les pods PrestaShop
      ansible.builtin.command: k3s kubectl get pods -n prestashop -o wide
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
