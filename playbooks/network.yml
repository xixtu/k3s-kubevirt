---
# =============================================================
# PLAYBOOK : Configuration réseau - LACP + IPs statiques
# =============================================================
# OS cible : Ubuntu 25.10 (netplan + systemd-networkd)
#
# Usage :
#   ansible-playbook -i inventory/hosts.yml playbooks/network.yml
#
# Tags disponibles :
#   debug, packages, bonding, nm, netplan, apply, verify, hosts
#
# Configure :
#   - bond0 en mode 802.3ad (LACP) via netplan
#   - 4 interfaces esclaves : enp10s0f0/1 + enp11s0f0/1
#   - IP statique bond_ip par nœud (depuis inventaire)
#   - Gateway 192.168.0.254 + DNS 192.168.0.21
#   - /etc/hosts avec les IPs cluster
#
# NE TOUCHE PAS l'interface de management (DHCP) :
#   /etc/netplan/50-cloud-init.yaml est préservé.
# =============================================================

- name: Configuration réseau LACP + IPs statiques
  hosts: k3s_cluster
  become: true
  gather_facts: true

  pre_tasks:

    - name: Afficher la configuration réseau du nœud
      ansible.builtin.debug:
        msg:
          - "=== Configuration réseau : {{ inventory_hostname }} ==="
          - "bond0      : {{ bond_ip }}/{{ network_prefix }}"
          - "Gateway    : {{ network_gateway }}"
          - "DNS        : {{ network_dns | join(', ') }}"
          - "Bond mode  : {{ bond_mode }} (LACP)"
          - "Interfaces : {{ network_interfaces | join(', ') }}"
          - "Management : {{ ansible_host }} (DHCP - non modifiée)"
      tags: [network, debug]

    - name: Installer les packages réseau requis
      ansible.builtin.apt:
        name:
          - ifenslave
          - net-tools
          - bridge-utils
          - vlan
        state: present
        update_cache: yes
      tags: [network, packages]

  tasks:

    # =========================================================
    # DÉSACTIVER NETWORKMANAGER (conflit potentiel avec netplan)
    # =========================================================

    - name: Vérifier si NetworkManager est installé
      ansible.builtin.systemd:
        name: NetworkManager
      register: nm_status
      failed_when: false
      tags: [network, nm]

    - name: Arrêter et désactiver NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: stopped
        enabled: false
      when: nm_status.status is defined and nm_status.status.LoadState == "loaded"
      tags: [network, nm]

    # =========================================================
    # CHARGER LE MODULE BONDING
    # =========================================================

    - name: Charger le module kernel bonding
      community.general.modprobe:
        name: bonding
        state: present
      tags: [network, bonding]

    - name: Rendre le module bonding persistant au démarrage
      ansible.builtin.copy:
        dest: /etc/modules-load.d/bonding.conf
        content: |
          # Module bonding chargé au démarrage pour LACP (802.3ad)
          bonding
        mode: '0644'
      tags: [network, bonding]

    # =========================================================
    # CONFIGURATION NETPLAN
    # =========================================================

    - name: Vérifier si /etc/netplan/50-cloud-init.yaml existe
      ansible.builtin.stat:
        path: /etc/netplan/50-cloud-init.yaml
      register: cloud_init_netplan
      tags: [network, netplan]

    - name: Sauvegarder la configuration netplan cloud-init
      ansible.builtin.copy:
        src: /etc/netplan/50-cloud-init.yaml
        dest: /etc/netplan/50-cloud-init.yaml.backup
        remote_src: true
      when: cloud_init_netplan.stat.exists
      tags: [network, netplan]

    - name: Déployer la configuration netplan bond0 (LACP)
      ansible.builtin.template:
        src: ../templates/netplan-bond.j2
        dest: /etc/netplan/01-netcfg.yaml
        mode: '0600'
        owner: root
        group: root
      tags: [network, netplan]

    - name: Valider la configuration netplan (dry-run)
      ansible.builtin.command: netplan generate
      register: netplan_generate
      changed_when: false
      tags: [network, netplan]

    - name: Afficher le résultat de la validation netplan
      ansible.builtin.debug:
        var: netplan_generate.stdout_lines
      when: netplan_generate.stdout_lines | length > 0
      tags: [network, netplan]

    # =========================================================
    # APPLIQUER LA CONFIGURATION
    # =========================================================

    - name: Appliquer la configuration netplan
      ansible.builtin.command: netplan apply
      async: 60
      poll: 0
      tags: [network, apply]

    - name: Attendre la stabilisation du réseau (LACP negociation)
      ansible.builtin.wait_for:
        timeout: 20
      delegate_to: localhost
      tags: [network, apply]

    - name: Vérifier la reconnexion SSH après reconfiguration
      ansible.builtin.wait_for_connection:
        timeout: 90
        delay: 5
      tags: [network, apply]

    # =========================================================
    # VÉRIFICATION FINALE
    # =========================================================

    - name: Vérifier l'état du bond (/proc/net/bonding/bond0)
      ansible.builtin.command: cat /proc/net/bonding/bond0
      register: bond_status
      changed_when: false
      failed_when: false
      tags: [network, verify]

    - name: Afficher l'état du bond
      ansible.builtin.debug:
        var: bond_status.stdout_lines
      tags: [network, verify]

    - name: Vérifier les interfaces réseau
      ansible.builtin.command: ip addr show
      register: ip_addr
      changed_when: false
      tags: [network, verify]

    - name: Afficher les interfaces
      ansible.builtin.debug:
        var: ip_addr.stdout_lines
      tags: [network, verify]

    - name: Vérifier la table de routage
      ansible.builtin.command: ip route show
      register: ip_route
      changed_when: false
      tags: [network, verify]

    - name: Afficher les routes
      ansible.builtin.debug:
        var: ip_route.stdout_lines
      tags: [network, verify]

    - name: Tester la joignabilité de la gateway
      ansible.builtin.command: ping -c 3 -W 2 {{ network_gateway }}
      register: ping_gateway
      changed_when: false
      failed_when: false
      tags: [network, verify]

    - name: Tester la joignabilité du DNS
      ansible.builtin.command: ping -c 3 -W 2 {{ network_dns[0] }}
      register: ping_dns
      changed_when: false
      failed_when: false
      tags: [network, verify]

    - name: Résumé de configuration réseau
      ansible.builtin.debug:
        msg:
          - "=== Configuration réseau OK sur {{ inventory_hostname }} ==="
          - "bond0      : {{ bond_ip }}/{{ network_prefix }}"
          - "Gateway    : {{ network_gateway }} ({{ 'OK' if ping_gateway.rc == 0 else 'ECHEC' }})"
          - "DNS        : {{ network_dns[0] }} ({{ 'OK' if ping_dns.rc == 0 else 'ECHEC' }})"
          - "Interfaces : {{ network_interfaces | length }} ports LACP"
      tags: [network, verify]

  # ===========================================================
  # POST-TASKS : /etc/hosts
  # ===========================================================

  post_tasks:

    - name: Supprimer les anciennes entrées k3s-node incorrectes de /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^192\.168\.1\.\d+\s+k3s-node-'
        state: absent
      tags: [network, hosts]

    - name: Mettre à jour /etc/hosts avec les IPs cluster
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          # Cluster K3s - IPs bond0 (LACP statique)
          192.168.0.11    k3s-node-1 k3s-node-1.{{ network_domain }}
          192.168.0.12    k3s-node-2 k3s-node-2.{{ network_domain }}
          192.168.0.13    k3s-node-3 k3s-node-3.{{ network_domain }}
        marker: "# {mark} ANSIBLE MANAGED BLOCK - K3s Cluster"
        create: true
      tags: [network, hosts]

  # ===========================================================
  # HANDLERS
  # ===========================================================

  handlers:

    - name: Reload systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        state: reloaded
