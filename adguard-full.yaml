---
# 1. Création du Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: adguardhome
---
# 2. Persistance sur Longhorn (Classe par défaut)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-config-pvc
  namespace: adguardhome
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fast # Ta nouvelle classe par défaut
  resources:
    requests:
      storage: 5Gi
---
# 3. Le Déploiement AdGuard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguardhome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      containers:
      - name: adguardhome
        image: adguard/adguardhome:latest
        ports:
        - containerPort: 3000
          name: http-setup
        - containerPort: 80
          name: http-web
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /opt/adguardhome/conf
        - name: work
          mountPath: /opt/adguardhome/work
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: adguard-config-pvc
      - name: work
        emptyDir: {}
---
# 4. Le Service LoadBalancer pour l'IP Fixe (192.168.0.21)
apiVersion: v1
kind: Service
metadata:
  name: adguard-service
  namespace: adguardhome
spec:
  selector:
    app: adguardhome
  type: LoadBalancer
  loadBalancerIP: 192.168.0.21
  externalTrafficPolicy: Local # Crucial pour voir les vraies IPs des clients
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  - name: http-setup
    port: 3000
    targetPort: 3000
  - name: http-web
    port: 80
    targetPort: 80