---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: guacamole-postgresql
  namespace: guacamole
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: guacamole
    app.kubernetes.io/component: database
spec:
  serviceName: guacamole-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/part-of: guacamole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: guacamole
        app.kubernetes.io/component: database
    spec:
      initContainers:
        - name: generate-schema
          image: guacamole/guacamole:1.6.0
          command: ["/bin/sh", "-c"]
          args:
            - /opt/guacamole/bin/initdb.sh --postgresql > /initdb-gen/01-schema.sql
          volumeMounts:
            - name: initdb-generated
              mountPath: /initdb-gen

      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: guacamole-db-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: initdb-generated
              mountPath: /docker-entrypoint-initdb.d/01-schema.sql
              subPath: 01-schema.sql
              readOnly: true
            - name: initdb-seed
              mountPath: /docker-entrypoint-initdb.d/02-seed.sql
              subPath: 02-seed-connections.sql
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "guacamole", "-d", "guacamole_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "guacamole", "-d", "guacamole_db"]
            initialDelaySeconds: 5
            periodSeconds: 5

        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/guacamole_db?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: guacamole-db-credentials
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: guacamole-db-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      volumes:
        - name: initdb-generated
          emptyDir: {}
        - name: initdb-seed
          configMap:
            name: guacamole-initdb

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/part-of: guacamole
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-fast
        resources:
          requests:
            storage: 5Gi
