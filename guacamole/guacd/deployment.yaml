---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: guacamole
  labels:
    app.kubernetes.io/name: guacd
    app.kubernetes.io/part-of: guacamole
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: guacd
      app.kubernetes.io/part-of: guacamole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guacd
        app.kubernetes.io/part-of: guacamole
        app.kubernetes.io/component: proxy
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0
          ports:
            - containerPort: 4822
              name: guacd
          volumeMounts:
            - name: data
              mountPath: /var/lib/guacamole
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 4822
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4822
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: guacd-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guacd-data
  namespace: guacamole
  labels:
    app.kubernetes.io/name: guacd
    app.kubernetes.io/part-of: guacamole
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: longhorn-fast
  resources:
    requests:
      storage: 10Gi
