---
# =============================================================
# Secret: samba-dc-credentials
# ⚠ REMPLIR les valeurs avant déploiement
# ⚠ En production: utiliser ansible-vault pour chiffrer
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: samba-dc-credentials
  namespace: active-directory
  labels:
    app: samba-dc
type: Opaque
stringData:
  # Mot de passe du compte Administrateur du domaine corpl.lcl
  # Utilisé pour la jonction initiale au domaine
  admin-password: "CHANGEME_MOT_DE_PASSE_AD_ADMIN"

  # IP du contrôleur de domaine existant (DC principal actuel de corpl.lcl)
  existing-dc-ip: "192.168.X.X"

  # Serveur de temps pour synchronisation NTP (DC existant ou NTP dédié)
  ntp-server: "192.168.X.X"
