apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: "restricted"
        enforce-version: "latest"
        audit: "restricted"
        audit-version: "latest"
        warn: "restricted"
        warn-version: "latest"
      exemptions:
        # Namespaces exemptés du profil restricted :
        #   kube-system       → composants système K3s (coredns, metrics-server, etc.)
        #   cis-operator      → opérateur CIS benchmark
        #   virt-operator     → KubeVirt (accès host requis)
        #   longhorn-system   → Longhorn storage (privileged + hostPath requis)
        #   metallb-system    → MetalLB speaker (NET_RAW requis)
        #   adguardhome       → AdGuard image officielle ne supporte pas non-root (issue #7619)
        usernames: []
        runtimeClasses: []
        namespaces:
          - "kube-system"
          - "cis-operator"
          - "virt-operator"
          - "longhorn-system"
          - "metallb-system"
          - "adguardhome"