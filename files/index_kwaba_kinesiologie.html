<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="10;url=https://www.kwaba-kinesiologie.fr/">
    <title>Redirection - Kwaba Kinésiologie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Effet de fond animé */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            top: -250px;
            left: -250px;
            animation-delay: 0s;
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            bottom: -200px;
            right: -200px;
            animation-delay: 7s;
        }

        .orb3 {
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            top: 50%;
            right: -150px;
            animation-delay: 14s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(100px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 100px) scale(0.9);
            }
        }

        .container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 80px 60px;
            text-align: center;
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-block;
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #a8b8ff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        h1 {
            color: #ffffff;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 40px;
        }

        .new-address-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin: 40px 0;
            position: relative;
            overflow: hidden;
        }

        .new-address-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0%, 100% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(100%);
            }
        }

        .new-address {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            word-break: break-all;
        }

        .countdown-container {
            margin: 50px 0;
        }

        .countdown-wrapper {
            display: inline-block;
            position: relative;
        }

        .countdown-circle {
            width: 180px;
            height: 180px;
            position: relative;
            margin: 0 auto;
        }

        .countdown-circle svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .countdown-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 3;
        }

        .countdown-circle-progress {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 534;
            stroke-dashoffset: 534;
            animation: countdown 10s linear forwards;
        }

        @keyframes countdown {
            to {
                stroke-dashoffset: 0;
            }
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: 700;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .countdown-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
            margin-top: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .redirect-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 40px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            margin-top: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .redirect-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .redirect-button:hover::before {
            left: 100%;
        }

        .redirect-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.5);
        }

        .arrow {
            transition: transform 0.3s ease;
        }

        .redirect-button:hover .arrow {
            transform: translateX(5px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 60px 30px;
            }

            h1 {
                font-size: 32px;
            }

            .new-address {
                font-size: 16px;
            }

            .countdown-circle {
                width: 150px;
                height: 150px;
            }

            .countdown {
                font-size: 52px;
            }

            .orb1, .orb2, .orb3 {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="container">
        <div class="badge">Changement d'adresse</div>
        
        <h1>Ce site a déménagé</h1>
        <p class="subtitle">Retrouvez-moi sur ma nouvelle adresse</p>
        
        <div class="new-address-container">
            <div class="new-address">www.kwaba-kinesiologie.fr</div>
        </div>
        
        <div class="countdown-container">
            <div class="countdown-wrapper">
                <div class="countdown-circle">
                    <svg>
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle class="countdown-circle-bg" cx="90" cy="90" r="85"></circle>
                        <circle class="countdown-circle-progress" cx="90" cy="90" r="85"></circle>
                    </svg>
                    <div class="countdown" id="countdown">10</div>
                </div>
                <div class="countdown-label">Redirection automatique</div>
            </div>
        </div>

        <a href="https://www.kwaba-kinesiologie.fr/" class="redirect-button">
            <span>Accéder maintenant</span>
            <span class="arrow">→</span>
        </a>
    </div>

    <script>
        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');
        
        const countdown = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = 'https://www.kwaba-kinesiologie.fr/';
            }
        }, 1000);
    </script>
</body>
</html>
