---
# =============================================================
# INVENTAIRE ANSIBLE - Cluster K3s
# =============================================================
#
# ansible_host  = IP/hostname de l'interface de management (DHCP)
#                 => interface existante, NON modifiée par les playbooks
#
# node_ip       = IP statique à configurer sur bond0 (LACP)
#                 => configurée par playbooks/network.yml
#
# IMPORTANT : Remplacer les ansible_host ci-dessous par les IPs
#             DHCP actuelles de chaque serveur (interface management)
# =============================================================

all:
  children:
    k3s_cluster:
      # -----------------------------------------------------------
      # Variables réseau communes au cluster
      # -----------------------------------------------------------
      vars:
        # Connexion SSH via l'interface de management (DHCP)
        ansible_user: rocky
        ansible_become: true

        # --- Interfaces à agréger en LACP ---
        network_bond_name: bond0
        network_interfaces:
          - enp10s0f0
          - enp10s0f1
          - enp11s0f0
          - enp11s0f1

        # --- Adressage statique sur bond0 ---
        network_prefix: 24          # masque 255.255.255.0
        network_gateway: 192.168.0.254
        network_dns:
          - 192.168.0.100
        network_domain: cluster.local

        # --- Paramètres LACP (mode 802.3ad) ---
        bond_mode: "802.3ad"
        bond_miimon: 100            # ms, vérification liaison
        bond_lacp_rate: fast        # PDU LACP toutes les secondes
        bond_xmit_hash_policy: "layer3+4"  # hash src/dst IP+port

      # -----------------------------------------------------------
      # Hôtes (ansible_host = IP management DHCP actuelle)
      # -----------------------------------------------------------
      hosts:
        k3s-node-1:
          ansible_host: k3s-node-1   # Remplacer par l'IP DHCP management réelle
          node_ip: 192.168.0.11

        k3s-node-2:
          ansible_host: k3s-node-2   # Remplacer par l'IP DHCP management réelle
          node_ip: 192.168.0.12

        k3s-node-3:
          ansible_host: k3s-node-3   # Remplacer par l'IP DHCP management réelle
          node_ip: 192.168.0.13
