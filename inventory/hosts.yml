---
# =============================================================
# INVENTAIRE ANSIBLE - Cluster K3s
# =============================================================
# Infrastructure : 3x Dell Precision T5600
# OS             : Ubuntu 25.10 (→ 26.04 LTS en avril 2026)
# Cluster        : K3s HA + Longhorn + KubeVirt + Traefik
# =============================================================

all:
  vars:
    ansible_user: administrator
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  children:

    # =========================================================
    # GROUPE : Tous les nœuds K3s
    # =========================================================
    k3s_cluster:
      children:
        k3s_control_plane:
        k3s_workers:

    # =========================================================
    # GROUPE : Control Plane (tous les nœuds sont CP + Worker)
    # =========================================================
    k3s_control_plane:
      vars:
        # ---------------------------------------------------------
        # Configuration LACP bond0 (commune à tous les nœuds)
        # ---------------------------------------------------------
        # ansible_host = bond_ip (192.168.0.x statique)
        # Ansible se connecte directement via bond0 pour cohérence.

        network_bond_name: bond0
        network_interfaces:
          - enp10s0f0
          - enp10s0f1
          - enp11s0f0
          - enp11s0f1
        network_prefix: 24                    # masque 255.255.255.0
        network_gateway: 192.168.0.254
        network_dns:
          - 192.168.0.21
          - 8.8.8.8
        network_domain: cluster.local
        network_search_domains:
          - cluster.local
          - corp.lcl

        # Paramètres LACP (IEEE 802.3ad)
        bond_mode: "802.3ad"
        bond_miimon: 100                      # intervalle MII en ms
        bond_lacp_rate: fast                  # LACPDU toutes les secondes
        bond_xmit_hash_policy: "layer3+4"     # hash IP+port pour répartition

      hosts:

        # -----------------------------------------------------
        # NODE 1 - Premier control plane (cluster-init)
        # -----------------------------------------------------
        k3s-node-1:
          ansible_host: 192.168.0.11
          ansible_connection: local  # Ansible tourne sur le nœud lui-même → pas de SSH
          k3s_role: primary          # Premier nœud (cluster-init)

          # --- Configuration réseau ---
          node_ip: 192.168.0.11      # IP bond0 statique
          bond_ip: 192.168.0.11      # IP statique bond0 (LACP)
          node_name: k3s-node-1
          node_hostname: 1q0st72     # Hostname actuel Ubuntu

          # --- Matériel ---
          cpu_model: "Intel Xeon E5-2620 v0"
          cpu_cores: 12              # 2x6 cores
          cpu_threads: 24            # HT activé
          ram_gb: 128

          # --- Configuration disques ---
          # Disque OS (ne pas toucher !)
          disk_os:
            device: /dev/sde
            model: "Kingston SA400S3"
            size_gb: 223
            filesystem: ext4
            mountpoint: /
            role: os

          # TIER 1 - Ultra rapide (Samsung 860 Pro SSD)
          disk_tier_ultra:
            devices:
              - device: /dev/sdf
                model: "Samsung SSD 860 Pro"
                size_gb: 476
                serial: "S3EWNX0K123456"  # À vérifier
            vg_name: vg1
            lv_name: lv-0-samsung_860_pro
            mountpoint: /data_ultra
            filesystem: ext4
            longhorn_tag: ultra
            storage_class: longhorn-ultra
            total_size_gb: 476
            reserved_gb: 10
            usable_gb: 466

          # TIER 2 - Rapide (Samsung 870 SSD x2 en LVM)
          disk_tier_fast:
            devices:
              - device: /dev/sdc
                model: "Samsung SSD 870"
                size_gb: 931
              - device: /dev/sdd
                model: "Samsung SSD 870"
                size_gb: 931
            vg_name: vg2
            lv_name: lv-0
            mountpoint: /data_fast
            filesystem: ext4
            longhorn_tag: fast
            storage_class: longhorn-fast
            total_size_gb: 1862       # 2 x 931 GB
            reserved_gb: 20
            usable_gb: 1842

          # TIER 3 - Lent (HDD Seagate x2 en LVM)
          disk_tier_slow:
            devices:
              - device: /dev/sda
                model: "Seagate ST4000VN008"
                size_gb: 3638
              - device: /dev/sdb
                model: "Seagate ST4000VN008"
                size_gb: 3638
            vg_name: vg0
            lv_name: lv-0-st4000
            mountpoint: /data_slow
            filesystem: ext4
            longhorn_tag: slow
            storage_class: longhorn-slow
            total_size_gb: 7276       # 2 x 3638 GB
            reserved_gb: 100
            usable_gb: 7176

        # -----------------------------------------------------
        # NODE 2 - Second control plane
        # -----------------------------------------------------
        k3s-node-2:
          ansible_host: 192.168.0.12
          k3s_role: secondary

          # --- Configuration réseau ---
          node_ip: 192.168.0.12      # IP bond0 statique
          bond_ip: 192.168.0.12      # IP statique bond0 (LACP)
          node_name: k3s-node-2
          node_hostname: k3s-node-2   # À définir

          # --- Matériel ---
          cpu_model: "Intel Xeon E5-2620 v0"
          cpu_cores: 12
          cpu_threads: 24
          ram_gb: 128

          # --- Configuration disques ---
          # ⚠️  À adapter selon la config réelle du node 2 !
          # Même structure que node 1 à priori

          disk_os:
            device: /dev/sde         # À vérifier !
            model: "Kingston SA400S3"
            size_gb: 223
            filesystem: ext4
            mountpoint: /
            role: os

          disk_tier_ultra:
            devices:
              - device: /dev/sdf      # À vérifier !
                model: "Samsung SSD 860 Pro"
                size_gb: 476
            vg_name: vg1
            lv_name: lv-0-samsung_860_pro
            mountpoint: /data_ultra
            filesystem: ext4
            longhorn_tag: ultra
            storage_class: longhorn-ultra
            total_size_gb: 476
            reserved_gb: 10
            usable_gb: 466

          disk_tier_fast:
            devices:
              - device: /dev/sdc      # À vérifier !
                model: "Samsung SSD 870"
                size_gb: 931
              - device: /dev/sdd
                model: "Samsung SSD 870"
                size_gb: 931
            vg_name: vg2
            lv_name: lv-0
            mountpoint: /data_fast
            filesystem: ext4
            longhorn_tag: fast
            storage_class: longhorn-fast
            total_size_gb: 1862
            reserved_gb: 20
            usable_gb: 1842

          disk_tier_slow:
            devices:
              - device: /dev/sda      # À vérifier !
                model: "Seagate ST4000VN008"
                size_gb: 3638
              - device: /dev/sdb
                model: "Seagate ST4000VN008"
                size_gb: 3638
            vg_name: vg0
            lv_name: lv-0-st4000
            mountpoint: /data_slow
            filesystem: ext4
            longhorn_tag: slow
            storage_class: longhorn-slow
            total_size_gb: 7276
            reserved_gb: 100
            usable_gb: 7176

        # -----------------------------------------------------
        # NODE 3 - Troisième control plane
        # -----------------------------------------------------
        k3s-node-3:
          ansible_host: 192.168.0.13
          k3s_role: secondary

          # --- Configuration réseau ---
          node_ip: 192.168.0.13      # IP bond0 statique
          bond_ip: 192.168.0.13      # IP statique bond0 (LACP)
          node_name: k3s-node-3
          node_hostname: k3s-node-3   # À définir

          # --- Matériel ---
          cpu_model: "Intel Xeon E5-2620 v0"
          cpu_cores: 12
          cpu_threads: 24
          ram_gb: 128

          # --- Configuration disques ---
          # ⚠️  À adapter selon la config réelle du node 3 !

          disk_os:
            device: /dev/sde         # À vérifier !
            model: "Kingston SA400S3"
            size_gb: 223
            filesystem: ext4
            mountpoint: /
            role: os

          disk_tier_ultra:
            devices:
              - device: /dev/sdf      # À vérifier !
                model: "Samsung SSD 860 Pro"
                size_gb: 476
            vg_name: vg1
            lv_name: lv-0-samsung_860_pro
            mountpoint: /data_ultra
            filesystem: ext4
            longhorn_tag: ultra
            storage_class: longhorn-ultra
            total_size_gb: 476
            reserved_gb: 10
            usable_gb: 466

          disk_tier_fast:
            devices:
              - device: /dev/sdc      # À vérifier !
                model: "Samsung SSD 870"
                size_gb: 931
              - device: /dev/sdd
                model: "Samsung SSD 870"
                size_gb: 931
            vg_name: vg2
            lv_name: lv-0
            mountpoint: /data_fast
            filesystem: ext4
            longhorn_tag: fast
            storage_class: longhorn-fast
            total_size_gb: 1862
            reserved_gb: 20
            usable_gb: 1842

          disk_tier_slow:
            devices:
              - device: /dev/sda      # À vérifier !
                model: "Seagate ST4000VN008"
                size_gb: 3638
              - device: /dev/sdb
                model: "Seagate ST4000VN008"
                size_gb: 3638
            vg_name: vg0
            lv_name: lv-0-st4000
            mountpoint: /data_slow
            filesystem: ext4
            longhorn_tag: slow
            storage_class: longhorn-slow
            total_size_gb: 7276
            reserved_gb: 100
            usable_gb: 7176

    # =========================================================
    # GROUPE : Workers uniquement (vide pour l'instant)
    # Tous nos nœuds sont control-plane + worker
    # =========================================================
    k3s_workers:
      hosts: {}
