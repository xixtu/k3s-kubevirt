{{- if .Values.ingress.enabled }}
# Ingress K8s : déclenche cert-manager (pattern du cluster), HTTP → HTTPS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress-tls
  labels:
    {{- include "collectd-exporter.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    cert-manager.io/private-key-algorithm: "ECDSA"
    cert-manager.io/private-key-size: "384"
    cert-manager.io/private-key-rotation-policy: "Always"
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.ingress.redirectMiddleware | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 9103
---
# HTTPS : seulement /collectd-post, avec login
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-https
  labels:
    {{- include "collectd-exporter.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/collectd-post`)
      kind: Rule
      middlewares:
        - name: {{ .Values.ingress.authMiddleware }}
      services:
        - name: {{ .Release.Name }}
          port: 9103
  tls:
    secretName: {{ .Values.ingress.tlsSecret }}
{{- end }}
