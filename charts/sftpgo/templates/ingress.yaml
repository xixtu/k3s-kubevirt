# Ingress K8s : déclenche cert-manager (pattern du cluster), HTTP → HTTPS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress-tls
  labels:
    {{- include "sftpgo.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.webdav.clusterIssuer }}
    cert-manager.io/private-key-algorithm: "ECDSA"
    cert-manager.io/private-key-size: "384"
    cert-manager.io/private-key-rotation-policy: "Always"
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.webdav.redirectMiddleware | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.webdav.host | quote }}
      secretName: {{ .Values.webdav.tlsSecret }}
  rules:
    - host: {{ .Values.webdav.host | quote }}
      http:
        paths:
          - path: /dav
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-webdav
                port:
                  number: 8090
---
# HTTPS : seulement /dav (WebDAV, authentification par les comptes SFTPGo)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-https
  labels:
    {{- include "sftpgo.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.webdav.host }}`) && PathPrefix(`/dav`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-webdav
          port: 8090
  tls:
    secretName: {{ .Values.webdav.tlsSecret }}
