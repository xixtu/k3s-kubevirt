{{- /* Comptes chargés au démarrage (--loaddata-from, mode 0 : créés ou mis à
       jour). Mots de passe en clair ici, hachés par SFTPGo au chargement. */ -}}
{{- $users := list -}}
{{- range .Values.clients }}
{{- $users = append $users (dict
      "username" .username
      "password" .password
      "status" 1
      "home_dir" (printf "/srv/sftpgo/data/openwrt/sauvegarde/%s" .name)
      "permissions" (dict "/" (list "upload" "create_dirs"))
      "max_sessions" 4
      "quota_size" 524288000
      "filters" (dict "denied_protocols" (list "SSH" "FTP" "HTTP") "max_upload_file_size" 20971520)
      "description" (printf "sauvegardes des bornes du client %s (depot seulement)" .name)) -}}
{{- end }}
{{- if .Values.lecture.username }}
{{- $users = append $users (dict
      "username" .Values.lecture.username
      "password" .Values.lecture.password
      "status" 1
      "home_dir" "/srv/sftpgo/data"
      "permissions" (dict "/" (list "list" "download"))
      "filters" (dict "denied_protocols" (list "DAV" "FTP" "HTTP"))
      "description" "lecture de toutes les sauvegardes (SFTP, reseau local)") -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-comptes
  labels:
    {{- include "sftpgo.labels" . | nindent 4 }}
type: Opaque
stringData:
  comptes.json: {{ dict "users" $users "folders" (list) "admins" (list) | toJson | quote }}
