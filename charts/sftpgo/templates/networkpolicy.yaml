# SFTPGo : entrée WebDAV depuis Traefik seulement, SFTP depuis le réseau local
# seulement ; AUCUNE sortie (pas d'AD, pas d'Internet, pas d'autre pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sftpgo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sftpgo.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.webdav.traefikNamespace }}
      ports:
        - port: 8090
    - from:
        - ipBlock:
            cidr: {{ .Values.sftp.allowedCIDR }}
      ports:
        - port: 2022
  egress: []
---
# Nettoyage : aucun accès réseau
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-retention
  labels:
    {{- include "sftpgo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sftpgo-retention
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
