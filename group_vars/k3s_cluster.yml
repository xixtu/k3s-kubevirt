---
# =============================================================
# VARIABLES GLOBALES - Tous les nœuds K3s
# =============================================================

# --- Version des composants ---
k3s_version: "v1.30.0+k3s1"
longhorn_version: "1.11.0"
kubevirt_version: "v1.2.0"
metallb_version: "v0.13.12"
cert_manager_version: "v1.13.0"
traefik_version: "34.2.0"
headlamp_version: "0.40.0"
prometheus_stack_version: "55.5.0"
rancher_version: "2.8.0"

# --- Headlamp dashboard ---
headlamp_config:
  hostname: "headlamp.{{ cluster_network.apps_domain }}"

# --- Configuration réseau cluster ---
cluster_network:
  pod_cidr: "10.42.0.0/16"
  service_cidr: "10.43.0.0/16"
  cluster_dns: "10.43.0.10"
  metallb_pool: "192.168.0.21-192.168.0.60"
  traefik_ip: "192.168.0.20"       # IP fixe assignée à Traefik via MetalLB
  apps_domain: "app.corp.lcl"      # *.app.corp.lcl → 192.168.0.20 (DNS interne)
  vm_network: "192.168.10.0/24"
  api_server_ip: "192.168.0.11"    # Node 1 = primary

# --- Configuration K3s ---
k3s_config:
  data_dir: "/data_fast/k3s"              # Runtime K3s hors du SSD OS (containerd, etcd, images)
  disable:
    - traefik
    - servicelb
  flannel_backend: vxlan
  write_kubeconfig_mode: "644"
  kubelet_args:
    - "topology-manager-policy=best-effort"
    - "cpu-manager-policy=static"
    - "kube-reserved=cpu=500m,memory=256Mi"  # obligatoire avec cpu-manager-policy=static

# --- Configuration Longhorn globale ---
longhorn_config:
  default_replica_count: 2
  storage_minimal_available_percentage: 15
  storage_over_provisioning_percentage: 150
  guaranteed_engine_manager_cpu: 5
  guaranteed_replica_manager_cpu: 5
  backup_target: ""                # À configurer si backup S3
  # Répertoires Longhorn par tier (créés par k3s_storage_setup.yml)
  disk_paths:
    ultra: "/data_ultra/longhorn"
    fast: "/data_fast/longhorn"
    slow: "/data_slow/longhorn"

# --- Longhorn Storage Classes ---
longhorn_storage_classes:
  - name: longhorn-ultra
    default: false
    replica_count: 2
    disk_selector: ultra
    node_selector: ""
    data_locality: best-effort
    reclaim_policy: Delete
    fs_type: ext4

  - name: longhorn-fast
    default: true                  # Classe par défaut
    replica_count: 2
    disk_selector: fast
    node_selector: ""
    data_locality: best-effort
    reclaim_policy: Delete
    fs_type: ext4

  - name: longhorn-slow
    default: false
    replica_count: 2
    disk_selector: slow
    node_selector: ""
    data_locality: best-effort
    reclaim_policy: Delete
    fs_type: ext4

# --- Active Directory Domain Controller (Samba 4 AD DC) ---
# Contrôleur de domaine en container (StatefulSet) qui rejoint corpl.lcl
# et peut reprendre les rôles FSMO de l'AD existant
ad_config:
  domain: "corpl.lcl"
  realm: "CORPL.LCL"
  netbios_domain: "CORPL"
  dc_hostname: "dc2"            # Hostname du DC container (dc2.corpl.lcl)
  dc_ip: "192.168.0.29"         # IP fixe MetalLB (dans pool 192.168.0.21-60)
  dns_forwarder: "192.168.0.21" # DNS forwarder pour résolution externe
  existing_dc_ip: "192.168.0.100" # IP du DC existant corpl.lcl
  admin_password: "CHANGEME_MOT_DE_PASSE_AD_ADMIN" # ⚠ Remplacer par le vrai mot de passe (ou ansible-vault)
  # Rôles FSMO disponibles (à transférer après jonction stable):
  #   pdc, rid, infrastructure (domaine)
  #   naming, schema (forêt)
  storage_class: "longhorn-fast"
  data_size: "50Gi"
  logs_size: "5Gi"

# --- NAS Configuration (Option C Hybride + Active Directory) ---
# Architecture :
#   Longhorn PVC (RWX - longhorn-slow)
#   ├── Samba AD Member (RW) → SMB shares auth AD pour postes + Nextcloud
#   └── Plex (RO) → Streaming média direct depuis le volume
#
# Flux :
#   Postes AD (corp.lcl) ──SMB/Kerberos──► Samba Pod ──écrit──► Volume Longhorn
#   Nextcloud             ──SMB (svc AD)──► Samba Pod ──écrit──►       │
#   Plex                  ◄──lit directement (read-only)───────────────┘
nas_config:
  storage_class: "longhorn-slow"
  nas_storage_size: "2Ti"                # ⚠ Ajuster selon besoin (~10.5 TB dispo avec replica:2)
  plex_config_storage_class: "longhorn-fast"
  plex_config_storage_size: "20Gi"       # Config Plex + base de données métadonnées
  samba_ip: "192.168.0.30"              # IP fixe MetalLB pour Samba (\\192.168.0.30\media)
  plex_ip: "192.168.0.31"              # IP fixe MetalLB pour Plex (http://192.168.0.31:32400)
  plex_claim_token: ""                  # Obtenir sur https://plex.tv/claim (optionnel, config via UI)
  # --- Active Directory (corp.lcl) ---
  ad_domain: "corp.lcl"
  ad_realm: "CORP.LCL"
  ad_workgroup: "CORP"
  ad_dc_hostname: "dc1.corp.lcl"
  ad_dc_ip: "192.168.0.100"
  ad_join_user: "svc-adjoin"            # Compte de service pour jonction AD
  ad_join_password: "ch4nge-me-ad"       # ⚠ ansible-vault en production
  # --- Shares avec groupes AD ---
  shares:
    - name: media
      path: /nas/media
      comment: "Fichiers media (vidéos, musique, photos)"
      ad_group: "NAS-media-rw"
    - name: documents
      path: /nas/documents
      comment: "Documents partagés"
      ad_group: "NAS-documents-rw"
    - name: shared
      path: /nas/shared
      comment: "Partage commun"
      ad_group: "NAS-shared-rw"

# --- Nextcloud Configuration ---
# Se connecte au NAS via plugin "External Storage: SMB/CIFS"
# Host SMB interne : samba-service.nas.svc.cluster.local
# Auth : utiliser un compte de service AD (ex: svc-nextcloud@corp.lcl)
nextcloud_config:
  admin_user: "admin"
  admin_password: "ch4nge-me-nextcloud"   # ⚠ Changer en production (ou ansible-vault)
  db_name: "nextcloud"
  db_user: "nextcloud"
  db_password: "nextcloud-db-s3cret"      # ⚠ Changer en production (ou ansible-vault)
  storage_class: "longhorn-fast"
  db_storage_size: "5Gi"
  data_storage_size: "50Gi"               # Données app, cache, thumbnails (fichiers sur NAS via SMB)
  # LDAP / Active Directory
  ldap_bind_user: "s_next_ad"
  ldap_bind_password: "ffofkOPJPO+236f"   # ⚠ Changer en production (ou ansible-vault)

# --- Collabora Online Configuration ---
collabora_config:
  admin_user: "admin"
  admin_password: "ch4nge-me-collabora"   # ⚠ Changer en production (ou ansible-vault)

# --- External Storage SMB (montage global Nextcloud) ---
external_storage:
  smb_host: "multinas.corp.lcl"            # NAS cible (hostname ou IP)
  smb_share: "documents"                   # Nom du partage SMB
  smb_domain: "CORP"                       # Domaine NetBIOS pour auth SMB
  mount_point: "Documents"                 # Point de montage dans Nextcloud

# --- Domaines et certificats ---
cluster_domain: "cluster.local"
letsencrypt_email: "admin@xixtu.eu"    # ⚠ Mettre l'email réel du compte Let's Encrypt

# Domaines publics exposés via Traefik + cert-manager
external_domains:
  headlamp: "headlamp.app.xixtu.eu"
  longhorn: "longhorn.app.xixtu.eu"
  paheko: "paheko.app.xixtu.eu"
  kwaba: "kwaba-kinesiologie.xixtu.eu"
  mobilizon: "mobilizon.app.xixtu.eu"
  grafana: "grafana.app.xixtu.eu"
  prometheus: "prometheus.app.xixtu.eu"
  alertmanager: "alertmanager.app.xixtu.eu"
  nextcloud: "nextcloud.app.xixtu.eu"
  collabora: "collabora.app.xixtu.eu"
  plex: "plex.app.xixtu.eu"

# --- Monitoring ---
monitoring_config:
  prometheus_retention: "15d"
  prometheus_storage: "50Gi"
  prometheus_storage_class: "longhorn-fast"
  grafana_storage: "10Gi"
  grafana_storage_class: "longhorn-fast"
  alertmanager_storage: "10Gi"
  alertmanager_storage_class: "longhorn-fast"

# --- Telegram Alerting ---
# ⚠ Envisager ansible-vault pour chiffrer le token en production :
#   ansible-vault encrypt_string '<token>' --name 'telegram_bot_token'
telegram_bot_token: "7991230289:AAEIl8LouUtCYmE7fSUFpUU5r5TFr3HN_6k"
telegram_chat_id: "-5183003485"

# --- Packages Ubuntu à installer ---
common_packages:
  - git
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - open-iscsi
  - nfs-common
  - jq
  - unzip
  - python3-pip
  - lvm2
  - smartmontools
  - nvme-cli
  - iotop
  - sysstat
  - net-tools
  - glances
  - cmatrix
  - hollywood
  - btop 

# --- Configuration système ---
system_config:
  swapoff: true
  timezone: "Europe/Paris"
  locale: "fr_FR.UTF-8"

# --- Kernel modules requis ---
kernel_modules:
  - overlay          # requis par containerd / K3s
  - br_netfilter     # expose net.bridge.* dans /proc/sys (sysctl)
  - kvm
  - kvm_intel
  - vhost_net
  - vhost_vsock
  - dm_snapshot
  - dm_mirror
  - dm_thin_pool

# --- Sysctl tuning ---
sysctl_settings:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.core.somaxconn: 32768
  net.ipv4.tcp_max_syn_backlog: 8192
  fs.file-max: 2097152
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 8192
  vm.swappiness: 10
  vm.dirty_ratio: 15
  vm.dirty_background_ratio: 5
