apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: typebot-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "builder.{{ .Values.domain }}"
        - "viewer.{{ .Values.domain }}"
        - "mailpit.{{ .Values.domain }}"
      secretName: typebot-tls-certs
  rules:
    - host: "builder.{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: typebot-builder
                port:
                  number: 3000
    - host: "viewer.{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: typebot-viewer
                port:
                  number: 3000
