apiVersion: apps/v1
kind: Deployment
metadata:
  name: typebot-viewer
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typebot-viewer
  template:
    metadata:
      labels:
        app: typebot-viewer
    spec:
      containers:
        - name: viewer
          image: {{ .Values.images.viewer }}
          envFrom:
            - secretRef:
                name: typebot-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@typebot-postgres:5432/{{ .Values.postgresql.db }}?schema=public"
            - name: NEXTAUTH_URL
              value: "https://builder.{{ .Values.domain }}"
            - name: ENCRYPTION_SECRET
              value: {{ .Values.encryptionSecret }}
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_VIEWER_URL
              value: "https://viewer.{{ .Values.domain }}"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: typebot-viewer
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: typebot-viewer
