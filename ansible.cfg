[defaults]
# Inventaire par défaut
inventory           = inventory/hosts.yml

# Affichage
stdout_callback     = yaml
callbacks_enabled   = timer, profile_tasks

# Performance
forks               = 10
host_key_checking   = False
gathering           = smart
fact_caching        = memory

# Logs
log_path            = ./ansible.log

# Retry
retry_files_enabled = False

# Timeout SSH
timeout             = 30

# Collections
collections_path    = ~/.ansible/collections

[ssh_connection]
# ControlPersist=30m : maintient la connexion SSH maître pendant les
# kubectl wait longs (installation PrestaShop ~10-20 min, etc.)
# ServerAliveInterval/CountMax : keepalive pour éviter les timeouts réseau
ssh_args            = -o ControlMaster=auto -o ControlPersist=30m -o ServerAliveInterval=30 -o ServerAliveCountMax=40
pipelining          = True

[privilege_escalation]
become              = True
become_method       = sudo
become_ask_pass     = False
